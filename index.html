    const w = document.getElementById('print-area');
    w.innerHTML = `<div class="cert"><div class="cert-in">${App.mascot('cheer', 120)}<h1>شهادة إتقان</h1><p>تشهد منصة «نجيب» التعليمية بأن الطالب/ة</p><h2>${t(p.name)}</h2><p>قد أتقن/ت جميع دروس</p><h3>${t(chapter.title)}</h3><p>${App.fmtDate(Date.now())}</p><p class="muted">أحسنت! استمر في التميز 🌟</p></div></div>`;
    setTimeout(() => window.print(), 100);
  };
})();

</script>
  <script>/* js/admin.js */
/* لوحة المشرف والإدارة */
(function () {
  const App = window.App;
  const t = (s) => App.t(s);
  const N = (n) => App.num(n);
  const esc = App.esc;
  const main = () => document.getElementById('main');
  const TABS = [['dash', '📊 لوحة المعلومات'], ['content', '📚 المحتوى'], ['bank', '❓ بنك الأسئلة'], ['tests', '🧪 الاختبارات'], ['students', '👥 الطلاب والنتائج'], ['reports', '📈 التقارير'], ['settings', '⚙️ الإعدادات والنسخ الاحتياطي']];

  const shell = (tab, html) => {
    main().innerHTML = `<div class="admin"><div class="admin-top"><h1>🔐 لوحة المشرف</h1><button class="btn ghost sm" data-logout>خروج من لوحة المشرف</button></div>
      <nav class="tabs">${TABS.map(([id, n]) => `<a href="#/admin/${id}" class="${id === tab ? 'on' : ''}">${n}</a>`).join('')}</nav><div class="admin-body">${html}</div></div>`;
    main().querySelector('[data-logout]').onclick = () => { App.adminOK = false; App.go(Progress.current() ? 'home' : 'profiles'); };
    return main().querySelector('.admin-body');
  };

  /* ===================== الدخول ===================== */
  App.views.admin = (tab, arg) => {
    const s = App.settings();
    if (!App.adminOK) {
      const first = !s.adminPin;
      main().innerHTML = `<section class="card narrow center">${App.mascot('think', 100)}<h1>دخول المشرف</h1>
        ${first ? '<p>هذه أول مرة. أنشئ رمز دخول للمشرف (4 أرقام أو أكثر) واحفظه جيداً.</p><input class="ans-input" type="password" inputmode="numeric" placeholder="الرمز الجديد" data-p1 autofocus><input class="ans-input" type="password" inputmode="numeric" placeholder="أعد كتابة الرمز" data-p2>' : '<input class="ans-input" type="password" inputmode="numeric" placeholder="رمز المشرف" data-p1 autofocus>'}
        <button class="btn primary big" data-go>${first ? 'إنشاء الرمز والدخول' : 'دخول'}</button></section>`;
      const go = () => {
        const p1 = main().querySelector('[data-p1]').value.trim();
        if (first) {
          const p2 = main().querySelector('[data-p2]').value.trim();
          if (p1.length < 4) return App.toast('الرمز قصير جداً (4 أرقام على الأقل).', 'bad');
          if (p1 !== p2) return App.toast('الرمزان غير متطابقين.', 'bad');
          const s2 = App.settings(); s2.adminPin = App.hash(p1); App.saveSettings(s2);
        } else if (App.hash(p1) !== s.adminPin) { App.sound('bad'); return App.toast('الرمز غير صحيح.', 'bad'); }
        App.adminOK = true; App.views.admin(tab || 'dash', arg);
      };
      main().querySelector('[data-go]').onclick = go;
      setTimeout(() => main().querySelector('[data-p1]').focus(), 60);
      main().querySelectorAll('input').forEach((i) => i.onkeydown = (e) => { if (e.key === 'Enter') go(); });
      return;
    }
    (A[tab] || A.dash)(arg);
  };
  const A = {};

  /* ===================== لوحة المعلومات ===================== */
  function allStats() {
    const profiles = Progress.profiles();
    const per = profiles.map((p) => ({ p, g: Progress.get(p.id), tot: Progress.totals(p.id) }));
    const lessonAgg = {};
    per.forEach(({ g }) => Object.entries(g.qstats).forEach(([gid, st]) => { const lid = gid.split(':')[0]; lessonAgg[lid] = lessonAgg[lid] || { c: 0, w: 0 }; lessonAgg[lid].c += st.c; lessonAgg[lid].w += st.w; }));
    const lessons = Object.entries(lessonAgg).map(([lid, s]) => ({ lid, ...s, pct: Math.round((100 * s.c) / Math.max(1, s.c + s.w)) })).filter((x) => Content.get('lessons', x.lid));
    const attempts = per.flatMap(({ p, g }) => g.attempts.map((a) => Object.assign({ student: p }, a))).sort((a, b) => b.date - a.date);
    return { profiles, per, lessons, attempts };
  }
  A.dash = () => {
    const st = allStats();
    const nLessons = Object.keys(Content.all().lessons).length;
    const ready = Object.keys(Content.all().lessons).filter((id) => Content.hasBody(id)).length;
    const nQ = Content.allQuestions().length;
    const c = st.per.reduce((a, x) => a + x.tot.c, 0), w = st.per.reduce((a, x) => a + x.tot.w, 0);
    const avg = st.attempts.length ? Math.round(st.attempts.reduce((a, x) => a + x.pct, 0) / st.attempts.length) : 0;
    const weak = st.lessons.filter((x) => x.c + x.w >= 3).sort((a, b) => a.pct - b.pct).slice(0, 8);
    const body = shell('dash', `<section class="stats">
      <div class="stat"><span>👥</span><b>${N(st.profiles.length)}</b><small>طالب</small></div>
      <div class="stat"><span>📚</span><b>${N(ready)} / ${N(nLessons)}</b><small>درس مشروح</small></div>
      <div class="stat"><span>❓</span><b>${N(nQ)}</b><small>سؤال في البنك</small></div>
      <div class="stat"><span>🧪</span><b>${N(st.attempts.length)}</b><small>محاولة اختبار، متوسط ${N(avg)}٪</small></div></section>
      <section class="two-col"><div class="card"><h2>الإجابات</h2><p>✅ صحيحة: <b>${N(c)}</b> &nbsp; ❌ خاطئة: <b>${N(w)}</b></p>${App.ring(c + w ? (100 * c) / (c + w) : 0, 90)}</div>
      <div class="card"><h2>🌱 دروس يعاني فيها الطلاب</h2>${weak.length ? weak.map((x) => `<div class="list-row"><span>${t(Content.get('lessons', x.lid).title)} <small>${t(Content.path(x.lid).subject.name)}، ${t(Content.get('grades', Content.path(x.lid).grade.id).name)}</small></span><b class="${x.pct < 60 ? 'bad-text' : ''}">${N(x.pct)}٪</b></div>`).join('') : '<p class="muted">لا توجد بيانات كافية بعد.</p>'}</div></section>
      <section class="card"><h2>آخر المحاولات</h2>${st.attempts.length ? `<table class="data-table"><thead><tr><th>الطالب</th><th>الاختبار</th><th>التاريخ</th><th>النتيجة</th></tr></thead><tbody>${st.attempts.slice(0, 12).map((a) => `<tr><td>${a.student.avatar} ${t(a.student.name)}</td><td>${t(a.title)}</td><td>${App.fmtDate(a.date)}</td><td>${N(a.correct)}/${N(a.total)} (${N(a.pct)}٪)</td></tr>`).join('')}</tbody></table>` : '<p class="muted">لا توجد محاولات بعد.</p>'}</section>`);
  };

  /* ===================== المحتوى ===================== */
  A.content = () => {
    const tree = Content.grades().map((g) => `<details class="tree" open><summary><b>${t(g.name)}</b> <span class="acts"><button class="xs btn ghost" data-edit="grades:${g.id}">تعديل</button><button class="xs btn ghost" data-add="subjects:${g.id}">+ مادة</button><button class="xs btn danger ghost" data-del="grades:${g.id}">حذف</button></span></summary>
      ${Content.subjects(g.id).map((s) => `<details class="tree"><summary>${App.subjStyle(s).icon} <b>${t(s.name)}</b> <small>${N(Content.lessonsOfSubject(s.id).length)} درساً</small><span class="acts"><button class="xs btn ghost" data-edit="subjects:${s.id}">تعديل</button><button class="xs btn ghost" data-add="units:${s.id}">+ وحدة</button><button class="xs btn danger ghost" data-del="subjects:${s.id}">حذف</button></span></summary>
        ${Content.units(s.id).map((u) => `<details class="tree"><summary>${t(u.title)} <span class="tag">${t(Content.termName(u.term || 1).split(' (')[0])}</span><span class="acts"><button class="xs btn ghost" data-edit="units:${u.id}">تعديل</button><button class="xs btn ghost" data-add="chapters:${u.id}">+ فصل</button><button class="xs btn danger ghost" data-del="units:${u.id}">حذف</button></span></summary>
          ${Content.chapters(u.id).map((c) => `<div class="tree-ch"><div class="row between"><b>${t(c.title)}</b><span class="acts"><button class="xs btn ghost" data-edit="chapters:${c.id}">تعديل</button><button class="xs btn ghost" data-add="lessons:${c.id}">+ درس</button><button class="xs btn danger ghost" data-del="chapters:${c.id}">حذف</button></span></div>
            ${Content.lessonsOfChapter(c.id).map((l) => { const b = Content.body(l.id); const nq = Content.questions(l.id).length; return `<div class="tree-l"><span>${N(l.num)} ${t(l.title)} <small>ص ${N(l.page)}</small> ${Content.hasBody(l.id) ? `<span class="tag ${b.status === 'verified' ? 'ok' : 'warn'}">${b.status === 'verified' ? 'مراجَع' : 'مسودة'}</span>` : '<span class="tag">بلا شرح</span>'} <span class="tag">${N(nq)} سؤال</span></span><span class="acts"><button class="xs btn" data-body="${l.id}">✏️ الشرح</button><button class="xs btn ghost" data-qs="${l.id}">الأسئلة</button><button class="xs btn ghost" data-edit="lessons:${l.id}">بيانات</button><button class="xs btn danger ghost" data-del="lessons:${l.id}">حذف</button></span></div>`; }).join('')}</div>`).join('')}</details>`).join('')}</details>`).join('')}</details>`).join('');
    const body = shell('content', `<div class="row between"><p class="muted">الهيكل: الصف ← المادة ← الوحدة ← الفصل ← الدرس. في الرياضيات كل «فصل» في الكتاب يمثل وحدة.</p><button class="btn primary" data-add="grades:">+ صف دراسي</button></div>${tree}`);
    body.querySelectorAll('[data-add]').forEach((b) => b.onclick = (e) => { e.preventDefault(); const [kind, parent] = b.dataset.add.split(':'); nodeForm(kind, null, parent); });
    body.querySelectorAll('[data-edit]').forEach((b) => b.onclick = (e) => { e.preventDefault(); const [kind, id] = b.dataset.edit.split(':'); nodeForm(kind, Content.get(kind, id)); });
    body.querySelectorAll('[data-del]').forEach((b) => b.onclick = (e) => { e.preventDefault(); const [kind, id] = b.dataset.del.split(':'); const n = Content.get(kind, id); App.confirm(`حذف «${n.name || n.title}» وكل ما بداخله؟`, () => { Content.deleteNode(kind, id); App.toast('تم الحذف'); A.content(); }); });
    body.querySelectorAll('[data-body]').forEach((b) => b.onclick = (e) => { e.preventDefault(); bodyForm(b.dataset.body); });
    body.querySelectorAll('[data-qs]').forEach((b) => b.onclick = (e) => { e.preventDefault(); App.go('admin', 'bank', b.dataset.qs); });
  };

  function nodeForm(kind, node, parentId) {
    const isNew = !node; node = node ? Object.assign({}, node) : {};
    const labels = { grades: 'صف دراسي', subjects: 'مادة', units: 'وحدة', chapters: 'فصل', lessons: 'درس' };
    let fields = '';
    if (kind === 'grades') fields = `<label>اسم الصف<input name="name" value="${esc(node.name || '')}" placeholder="مثال: الصف الرابع"></label><label>الترتيب<input name="order" type="number" value="${node.order ?? 4}"></label>`;
    if (kind === 'subjects') fields = `<label>اسم المادة<input name="name" value="${esc(node.name || '')}"></label><label>النوع<select name="kind">${[['math', 'رياضيات'], ['science', 'علوم'], ['arabic', 'لغتي'], ['english', 'إنجليزي'], ['other', 'أخرى']].map(([v, n]) => `<option value="${v}" ${node.kind === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label><label>الكتاب/المصدر<input name="book" value="${esc(node.book || '')}"></label>`;
    if (kind === 'units') fields = `<label>العنوان<input name="title" value="${esc(node.title || '')}" placeholder="الوحدة 4: الطقس"></label><label>الجزء/الفصل الدراسي<select name="term">${[1, 2, 3].map((x) => `<option value="${x}" ${(node.term || App.settings().termNow) == x ? 'selected' : ''}>${Content.termName(x)}</option>`).join('')}</select></label><label>الترتيب<input name="order" type="number" value="${node.order ?? 99}"></label>`;
    if (kind === 'chapters') fields = `<label>العنوان<input name="title" value="${esc(node.title || '')}" placeholder="الفصل 7: ..."></label><label>صفحة البداية<input name="page" type="number" value="${node.page || ''}"></label><label>الترتيب<input name="order" type="number" value="${node.order ?? 99}"></label>`;
    if (kind === 'lessons') fields = `<label>رقم الدرس<input name="num" value="${esc(node.num || '')}" placeholder="7-1"></label><label>العنوان<input name="title" value="${esc(node.title || '')}"></label><label>الصفحة في الكتاب<input name="page" type="number" value="${node.page || ''}"></label><label class="check"><input type="checkbox" name="plan" ${node.plan ? 'checked' : ''}> درس خطة حل المسألة</label><label>الترتيب<input name="order" type="number" value="${node.order ?? 99}"></label>`;
    const m = App.modal(`<h3>${isNew ? 'إضافة' : 'تعديل'} ${labels[kind]}</h3><div class="form-grid">${fields}</div><div class="row end"><button class="btn primary" data-save>حفظ</button></div>`);
    m.el.querySelector('[data-save]').onclick = () => {
      m.el.querySelectorAll('[name]').forEach((i) => { node[i.name] = i.type === 'checkbox' ? i.checked : i.type === 'number' ? (i.value === '' ? undefined : Number(i.value)) : i.value.trim(); });
      if (!(node.name || node.title)) return App.toast('العنوان مطلوب', 'bad');
      if (isNew) {
        node.id = Content.newId({ grades: 'g', subjects: 's', units: 'u', chapters: 'c', lessons: 'l' }[kind]);
        const pk = { subjects: 'gradeId', units: 'subjectId', chapters: 'unitId', lessons: 'chapterId' }[kind];
        if (pk) node[pk] = parentId;
        if (kind === 'units' && !node.order) node.order = 99;
      }
      Content.saveNode(kind, node); m.close(); App.toast('تم الحفظ ✔', 'ok'); A.content();
    };
  }

  function bodyForm(lid) {
    const l = Content.get('lessons', lid); const b = Content.body(lid) || {};
    const lines = (a) => (a || []).join('\n');
    const m = App.modal(`<h3>✏️ شرح الدرس: ${t(l.title)}</h3><p class="muted">اكتب كل عنصر في سطر مستقل. الكسور تُكتب هكذا: {3/4}. يمكن استعمال &lt;b&gt; للتغميق في خطوات الشرح.</p>
      <div class="form-grid">
        <label>حالة المحتوى<select name="status"><option value="verified" ${b.status === 'verified' ? 'selected' : ''}>مراجَع ومطابق للكتاب</option><option value="draft" ${b.status !== 'verified' ? 'selected' : ''}>مسودة (يحتاج مراجعة)</option></select></label>
        <label>المصدر (الكتاب والصفحات)<input name="source" value="${esc(b.source || '')}"></label>
        <label class="full">2) ماذا سيتعلم الطالب؟ (هدف في كل سطر)<textarea name="objectives" rows="3">${esc(lines(b.objectives))}</textarea></label>
        <label class="full">3) مقدمة جاذبة<textarea name="intro" rows="2">${esc(b.intro || '')}</textarea></label>
        <label class="full">4) المفاهيم (سطر لكل مفهوم: المصطلح: التعريف)<textarea name="concepts" rows="4">${esc((b.concepts || []).map((c) => c.term + ': ' + c.def).join('\n'))}</textarea></label>
        <label class="full">5) الشرح التدريجي (لكل خطوة: العنوان في سطر ثم النص، وافصل بين الخطوات بسطر ---)<textarea name="steps" rows="8">${esc((b.steps || []).map((s) => s.title + '\n' + s.html).join('\n---\n'))}</textarea></label>
        <label class="full">6) أمثلة (سطر يبدأ بـ س: ثم سطر يبدأ بـ ج:)<textarea name="examples" rows="4">${esc((b.examples || []).map((e) => 'س: ' + e.q + '\nج: ' + e.a).join('\n'))}</textarea></label>
        <label class="full">مواقف من الحياة اليومية (سطر لكل موقف)<textarea name="life" rows="2">${esc(lines(b.life))}</textarea></label>
        <label class="full">8) أهم ما يجب حفظه<textarea name="keyPoints" rows="3">${esc(lines(b.keyPoints))}</textarea></label>
        <label class="full">9) الأخطاء الشائعة (سطر لكل خطأ: الخطأ | الصواب)<textarea name="mistakes" rows="3">${esc((b.mistakes || []).map((x) => x.wrong + ' | ' + x.right).join('\n'))}</textarea></label>
        <label class="full">10) الملخص<textarea name="summary" rows="2">${esc(b.summary || '')}</textarea></label>
        <label class="full">شرح بديل مبسط («اشرح لي بطريقة أخرى»)<textarea name="alt" rows="2">${esc(b.alt || '')}</textarea></label>
        <label>أداة تفاعلية<select name="tool"><option value="">بدون</option>${[['numberline', 'خط الأعداد'], ['fractions', 'أشرطة الكسور'], ['thermometer', 'مقياس الحرارة'], ['stats', 'حاسبة الإحصاء']].map(([v, n]) => `<option value="${v}" ${b.tool === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <div class="full"><div class="lbl">7) الصور التوضيحية</div><div class="imgs">${(b.images || []).map((src, i) => `<span class="thumb"><img src="${esc(src)}"><button data-rmimg="${i}">✕</button></span>`).join('')}</div><button class="btn ghost sm" data-addimg>+ إضافة صورة</button></div>
      </div><div class="row end"><button class="btn danger ghost" data-clear>حذف الشرح</button><button class="btn primary" data-save>حفظ الشرح</button></div>`, { wide: true, sticky: true });
    const images = (b.images || []).slice();
    const redrawImgs = () => { m.el.querySelector('.imgs').innerHTML = images.map((src, i) => `<span class="thumb"><img src="${esc(src)}"><button data-rmimg="${i}">✕</button></span>`).join(''); bindRm(); };
    const bindRm = () => m.el.querySelectorAll('[data-rmimg]').forEach((x) => x.onclick = () => { images.splice(Number(x.dataset.rmimg), 1); redrawImgs(); });
    bindRm();
    m.el.querySelector('[data-addimg]').onclick = () => App.pickFile('image/*', (data) => App.resizeImage(data, 900, (small) => { images.push(small); redrawImgs(); }), true);
    m.el.querySelector('[data-clear]').onclick = () => App.confirm('حذف شرح هذا الدرس؟', () => { Content.saveBody(lid, null); m.close(); A.content(); });
    m.el.querySelector('[data-save]').onclick = () => {
      const v = (n) => m.el.querySelector(`[name=${n}]`).value;
      const L = (n) => v(n).split('\n').map((x) => x.trim()).filter(Boolean);
      const ex = []; let cur = null;
      L('examples').forEach((line) => { if (/^س[:：]/.test(line)) { cur = { q: line.replace(/^س[:：]\s*/, ''), a: '' }; ex.push(cur); } else if (/^ج[:：]/.test(line) && cur) cur.a = line.replace(/^ج[:：]\s*/, ''); else if (cur) cur.a += ' ' + line; });
      const nb = Object.assign({}, b, {
        status: v('status'), source: v('source').trim(), objectives: L('objectives'), intro: v('intro').trim(),
        concepts: L('concepts').map((x) => { const k = x.indexOf(':'); return k > 0 ? { term: x.slice(0, k).trim(), def: x.slice(k + 1).trim() } : { term: x, def: '' }; }),
        steps: v('steps').split(/\n-{3,}\n/).map((blk) => { const [title, ...rest] = blk.trim().split('\n'); return { title: (title || '').trim(), html: rest.join('<br>').trim() }; }).filter((s) => s.title),
        examples: ex, life: L('life'), keyPoints: L('keyPoints'),
        mistakes: L('mistakes').map((x) => { const [w, r] = x.split('|'); return { wrong: (w || '').trim(), right: (r || '').trim() }; }),
        summary: v('summary').trim(), alt: v('alt').trim(), tool: v('tool') || undefined, images
      });
      Content.saveBody(lid, nb); m.close(); App.toast('تم حفظ الشرح ✔', 'ok'); A.content();
    };
  }

  /* ===================== بنك الأسئلة ===================== */
  let bankFilter = {};
  A.bank = (lessonId) => {
    if (lessonId) { const p = Content.path(lessonId); bankFilter = { grade: p.grade.id, subject: p.subject.id, unit: p.unit.id, lesson: lessonId }; }
    const f = bankFilter;
    const grades = Content.grades();
    const subjects = f.grade ? Content.subjects(f.grade) : [];
    const units = f.subject ? Content.units(f.subject) : [];
    const lessons = f.unit ? Content.lessonsOfUnit(f.unit) : f.subject ? Content.lessonsOfSubject(f.subject) : [];
    let qs;
    if (f.lesson) qs = Content.questions(f.lesson);
    else if (f.unit) qs = Content.lessonsOfUnit(f.unit).flatMap((l) => Content.questions(l.id));
    else if (f.subject) qs = Content.allQuestions({ subjectId: f.subject });
    else if (f.grade) qs = Content.allQuestions({ gradeId: f.grade });
    else qs = Content.allQuestions();
    if (f.lvl) qs = qs.filter((q) => q.lvl === Number(f.lvl));
    if (f.type) qs = qs.filter((q) => q.type === f.type);
    if (f.q) qs = qs.filter((q) => App.normText(q.q).includes(App.normText(f.q)));
    const opt = (arr, sel, lab) => `<option value="">${lab}</option>` + arr.map((x) => `<option value="${x.id}" ${sel === x.id ? 'selected' : ''}>${esc(x.name || (x.num ? x.num + ' ' + x.title : x.title))}</option>`).join('');
    const body = shell('bank', `<div class="filters">
      <select data-f="grade">${opt(grades, f.grade, 'كل الصفوف')}</select><select data-f="subject" ${f.grade ? '' : 'disabled'}>${opt(subjects, f.subject, 'كل المواد')}</select>
      <select data-f="unit" ${f.subject ? '' : 'disabled'}>${opt(units, f.unit, 'كل الوحدات')}</select><select data-f="lesson" ${f.subject ? '' : 'disabled'}>${opt(lessons, f.lesson, 'كل الدروس')}</select>

      <select data-f="type"><option value="">كل الأنواع</option>${Object.entries(App.TYPE_NAMES).map(([k, n]) => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <input data-f="q" placeholder="🔍 بحث في نص السؤال" value="${esc(f.q || '')}"></div>
      <div class="row between wrap gap"><b>${N(qs.length)} سؤالاً</b><span class="row wrap gap"><button class="btn primary" data-new>+ سؤال جديد</button><button class="btn ghost" data-import>📥 استيراد CSV/Excel</button><button class="btn ghost" data-export>📤 تصدير CSV</button><button class="btn ghost" data-template>📄 قالب الاستيراد</button>${f.lesson ? '<button class="btn ghost" data-print>🖨️ ورقة عمل</button>' : ''}</span></div>
      <table class="data-table qtable"><thead><tr><th>السؤال</th><th>الدرس</th><th>المستوى</th><th>النوع</th><th>الإجابة الصحيحة</th><th></th></tr></thead><tbody>
      ${qs.slice(0, 400).map((q) => `<tr><td>${t(App.plain(q.q).slice(0, 110))}</td><td><small>${t((Content.get('lessons', q.lessonId) || {}).title || '')}</small></td><td><span class="tag lvl${q.lvl}">${App.LEVEL_NAMES[q.lvl]}</span></td><td>${App.TYPE_NAMES[q.type]}</td><td><small>${t(App.correctText(q).slice(0, 60))}</small></td><td class="nowrap"><button class="xs btn ghost" data-edit="${q.gid}">تعديل</button><button class="xs btn danger ghost" data-del="${q.gid}">حذف</button></td></tr>`).join('')}</tbody></table>${qs.length > 400 ? '<p class="muted">تُعرض أول 400 نتيجة؛ استعمل الفلاتر.</p>' : ''}`);
    body.querySelectorAll('[data-f]').forEach((el) => el.onchange = el.tagName === 'INPUT' ? null : () => {
      const k = el.dataset.f; bankFilter[k] = el.value || undefined;
      const order = ['grade', 'subject', 'unit', 'lesson'];
      const i = order.indexOf(k); if (i >= 0) order.slice(i + 1).forEach((x) => delete bankFilter[x]);
      A.bank();
    });
    const qi = body.querySelector('[data-f=q]');
    qi.onkeydown = (e) => { if (e.key === 'Enter') { bankFilter.q = qi.value; A.bank(); } };
    body.querySelector('[data-new]').onclick = () => questionForm({ lessonId: f.lesson, lvl: Number(f.lvl) || 1, type: f.type || 'mcq' });
    body.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => questionForm(Content.question(b.dataset.edit)));
    body.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => App.confirm('حذف هذا السؤال؟', () => { Content.deleteQuestion(b.dataset.del); A.bank(); }));
    body.querySelector('[data-export]').onclick = () => App.download(`بنك-الأسئلة-${App.today()}.csv`, '﻿' + toCSV(qs), 'text/csv;charset=utf-8');
    body.querySelector('[data-template]').onclick = () => App.download('قالب-استيراد-الأسئلة.csv', '﻿' + TEMPLATE, 'text/csv;charset=utf-8');
    body.querySelector('[data-import]').onclick = () => importCSV();
    const pr = body.querySelector('[data-print]'); if (pr) pr.onclick = () => App.printWorksheet([f.lesson]);
  };

  /* CSV */
  const HEAD = ['lesson_id', 'level', 'type', 'question', 'options', 'answer', 'explanation', 'hint1', 'hint2'];
  const TEMPLATE = HEAD.join(',') + '\n' + [
    ['g3m-6-2', '1', 'mcq', 'ناتج 12 ÷ 3 يساوي:', '3|4|5|6', '2', '12 ÷ 3 = 4 لأن 3 × 4 = 12', 'فكر في جدول الضرب', ''],
    ['g3m-6-2', '1', 'tf', 'القسمة والضرب عمليتان مترابطتان.', '', 'صواب', 'كل جملة قسمة لها جملة ضرب مرتبطة بها.', '', ''],
    ['g3m-6-2', '2', 'fill', 'إذا كان 4 × 5 = 20 فإن 20 ÷ 5 = ____', '', '4|أربعة', 'الحقائق المترابطة', '', ''],
    ['g3m-6-2', '3', 'num', 'وزعت 21 قطعة على 3 أطباق بالتساوي، كم قطعة في كل طبق؟', '', '7', '21 ÷ 3 = 7', '', ''],
    ['g3m-6-2', '2', 'match', 'صل كل جملة قسمة بجملة الضرب المرتبطة بها:', '12 ÷ 3=3 × 4|10 ÷ 2=2 × 5', '', 'الحقائق المترابطة', '', ''],
    ['g3m-6-2', '2', 'order', 'رتب الأعداد من الأصغر إلى الأكبر:', '2|5|9', '', 'الترتيب التصاعدي', '', '']
  ].map((r) => r.map(csvCell).join(',')).join('\n');
  function csvCell(v) { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function toCSV(qs) {
    return HEAD.join(',') + '\n' + qs.map((q) => {
      let options = '', answer = '';
      if (q.type === 'mcq') { options = q.opts.join('|'); answer = String(q.a + 1); }
      else if (q.type === 'tf') answer = q.a ? 'صواب' : 'خطأ';
      else if (q.type === 'fill') answer = [].concat(q.a).join('|');
      else if (q.type === 'num') answer = String(q.a);
      else if (q.type === 'match') options = q.pairs.map((p) => p[0] + '=' + p[1]).join('|');
      else if (q.type === 'order') options = q.items.join('|');
      return [q.lessonId, q.lvl, q.type, q.q, options, answer, q.exp || '', (q.hints || [])[0] || '', (q.hints || [])[1] || ''].map(csvCell).join(',');
    }).join('\n');
  }
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const sep = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim()));
  }
  function rowToQuestion(r) {
    const [lessonId, level, type, question, options, answer, exp, h1, h2] = r.map((x) => (x || '').trim());
    if (!Content.get('lessons', lessonId)) throw new Error(`رمز الدرس غير موجود: ${lessonId}`);
    const lvl = Number(level); if (!(lvl >= 1 && lvl <= 4)) throw new Error('المستوى يجب أن يكون من 1 إلى 4');
    if (!App.TYPE_NAMES[type]) throw new Error(`نوع غير معروف: ${type}`);
    if (!question) throw new Error('نص السؤال فارغ');
    const q = { lessonId, lvl, type, q: question, exp, hints: [h1, h2].filter(Boolean) };
    const opts = options ? options.split('|').map((x) => x.trim()).filter(Boolean) : [];
    if (type === 'mcq') { if (opts.length < 2) throw new Error('يحتاج الاختيار من متعدد خيارين على الأقل'); q.opts = opts; const n = Number(answer); q.a = n >= 1 && n <= opts.length ? n - 1 : opts.indexOf(answer); if (q.a < 0) throw new Error('الإجابة لا تطابق أي خيار'); }
    else if (type === 'tf') { q.a = /^(صواب|صح|نعم|true|1|✔)$/i.test(answer); if (!q.a && !/^(خطأ|خطا|لا|false|0|✖)$/i.test(answer)) throw new Error('إجابة صواب/خطأ غير واضحة'); }
    else if (type === 'fill') { q.a = answer.split('|').map((x) => x.trim()).filter(Boolean); if (!q.a.length) throw new Error('لا توجد إجابة'); }
    else if (type === 'num') { q.a = App.parseNum(answer); if (isNaN(q.a)) throw new Error('الإجابة ليست عدداً'); }
    else if (type === 'match') { q.pairs = opts.map((x) => x.split('=').map((y) => y.trim())); if (q.pairs.length < 2 || q.pairs.some((p) => p.length !== 2 || !p[0] || !p[1])) throw new Error('صيغة التوصيل: يسار=يمين|يسار=يمين'); }
    else if (type === 'order') { q.items = opts; if (opts.length < 2) throw new Error('يحتاج الترتيب عنصرين على الأقل'); }
    return q;
  }
  function importCSV() {
    App.pickFile('.csv,text/csv,.txt', (text, file) => {
      if (/\.xlsx?$/i.test(file.name)) return App.toast('احفظ ملف Excel بصيغة «CSV UTF-8» ثم استورده.', 'bad');
      const rows = parseCSV(text);
      if (rows.length && rows[0][0].trim().toLowerCase() === 'lesson_id') rows.shift();
      const ok = [], errs = [];
      rows.forEach((r, i) => { try { ok.push(rowToQuestion(r)); } catch (e) { errs.push(`السطر ${i + 2}: ${e.message}`); } });
      const m = App.modal(`<h3>استيراد الأسئلة</h3><p>✅ أسئلة صالحة: <b>${N(ok.length)}</b> &nbsp; ⚠️ أخطاء: <b>${N(errs.length)}</b></p>${errs.length ? `<div class="errs">${errs.slice(0, 30).map((e) => `<p>${esc(e)}</p>`).join('')}</div>` : ''}<div class="row end"><button class="btn primary" data-go ${ok.length ? '' : 'disabled'}>استيراد ${N(ok.length)} سؤالاً</button></div>`);
      m.el.querySelector('[data-go]').onclick = () => { ok.forEach((q) => Content.saveQuestion(q)); m.close(); App.toast(`تم استيراد ${ok.length} سؤالاً ✔`, 'ok'); A.bank(); };
    });
  }

  function questionForm(q) {
    q = Object.assign({ lvl: 1, type: 'mcq', opts: ['', '', '', ''], a: 0, pairs: [['', ''], ['', ''], ['', '']], items: ['', '', ''], hints: [] }, JSON.parse(JSON.stringify(q || {})));
    const allLessons = Content.grades().flatMap((g) => Content.subjects(g.id).flatMap((s) => Content.lessonsOfSubject(s.id).map((l) => ({ l, s, g }))));
    const m = App.modal(`<h3>${q.gid ? 'تعديل سؤال' : 'سؤال جديد'}</h3><div class="qform"><div class="form-grid">
      <label class="full">الدرس<select name="lessonId">${allLessons.map(({ l, s, g }) => `<option value="${l.id}" ${q.lessonId === l.id ? 'selected' : ''}>${esc(g.name + '، ' + s.name + '، ' + l.num + ' ' + l.title)}</option>`).join('')}</select></label>
      <label>مستوى الصعوبة<select name="lvl">${[1, 2, 3, 4].map((k) => `<option value="${k}" ${q.lvl == k ? 'selected' : ''}>${k} — ${App.LEVEL_NAMES[k]}</option>`).join('')}</select></label>
      <label>نوع السؤال<select name="type">${Object.entries(App.TYPE_NAMES).map(([k, n]) => `<option value="${k}" ${q.type === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="full">نص السؤال<textarea name="q" rows="2">${esc(q.q || '')}</textarea></label>
      <div class="full" data-typebox></div>
      <label class="full">التفسير (يظهر بعد الإجابة)<textarea name="exp" rows="2">${esc(q.exp || '')}</textarea></label>
      <label>تلميح 1<input name="h1" value="${esc((q.hints || [])[0] || '')}"></label><label>تلميح 2<input name="h2" value="${esc((q.hints || [])[1] || '')}"></label>
      <label class="check"><input type="checkbox" name="critical" ${(q.tags || []).includes('critical') ? 'checked' : ''}> تفكير ناقد</label><label class="check"><input type="checkbox" name="problem" ${(q.tags || []).includes('problem') ? 'checked' : ''}> حل مشكلات</label>
      <div class="full"><div class="lbl">صورة للسؤال (اختياري)</div><div data-img>${q.img && typeof q.img === 'string' ? `<img class="q-img" src="${esc(q.img)}">` : (q.img ? '<span class="tag">رسم توضيحي مدمج</span>' : '')}</div><button class="btn ghost sm" data-addimg>اختيار صورة</button> <button class="btn ghost sm" data-rmimg>إزالة</button></div>
      </div><div class="preview card"><div class="lbl">معاينة فورية</div><div data-preview></div></div></div>
      <div class="row end"><button class="btn primary" data-save>حفظ السؤال</button></div>`, { wide: true, sticky: true });
    const typebox = () => {
      const type = m.el.querySelector('[name=type]').value; q.type = type;
      let h = '';
      if (type === 'mcq') h = `<div class="lbl">الخيارات (حدد الصحيح)</div>${q.opts.map((o, i) => `<div class="row gap"><input type="radio" name="mcq-a" value="${i}" ${q.a === i ? 'checked' : ''}><input data-opt="${i}" value="${esc(o)}" placeholder="الخيار ${i + 1}"></div>`).join('')}<button class="btn xs ghost" data-addopt>+ خيار</button>`;
      if (type === 'tf') h = `<div class="lbl">الإجابة الصحيحة</div><label class="check"><input type="radio" name="tf-a" value="1" ${q.a === true ? 'checked' : ''}> صواب</label><label class="check"><input type="radio" name="tf-a" value="0" ${q.a === false ? 'checked' : ''}> خطأ</label>`;
      if (type === 'fill') h = `<label>الإجابات المقبولة (افصل بينها بـ |)<input data-fill value="${esc([].concat(q.a ?? []).filter((x) => typeof x === 'string').join('|'))}"></label>`;
      if (type === 'num') h = `<label>الإجابة العددية<input data-num value="${typeof q.a === 'number' ? q.a : ''}"></label>`;
      if (type === 'match') h = `<div class="lbl">أزواج التوصيل</div>${q.pairs.map((p, i) => `<div class="row gap"><input data-pl="${i}" value="${esc(p[0])}" placeholder="العنصر"><span>←</span><input data-pr="${i}" value="${esc(p[1])}" placeholder="ما يقابله"></div>`).join('')}<button class="btn xs ghost" data-addpair>+ زوج</button>`;
      if (type === 'order') h = `<div class="lbl">العناصر بالترتيب الصحيح</div>${q.items.map((x, i) => `<div class="row gap"><b>${i + 1}</b><input data-it="${i}" value="${esc(x)}"></div>`).join('')}<button class="btn xs ghost" data-additem>+ عنصر</button>`;
      m.el.querySelector('[data-typebox]').innerHTML = h;
      const add = (sel, fn) => { const b = m.el.querySelector(sel); if (b) b.onclick = () => { collect(); fn(); typebox(); }; };
      add('[data-addopt]', () => q.opts.push('')); add('[data-addpair]', () => q.pairs.push(['', ''])); add('[data-additem]', () => q.items.push(''));
      m.el.querySelectorAll('[data-typebox] input').forEach((i) => i.oninput = i.onchange = preview);
      preview();
    };
    const collect = () => {
      const v = (n) => m.el.querySelector(`[name=${n}]`).value;
      q.lessonId = v('lessonId'); q.lvl = Number(v('lvl')); q.type = v('type'); q.q = v('q').trim(); q.exp = v('exp').trim();
      q.hints = [v('h1'), v('h2')].map((x) => x.trim()).filter(Boolean);
      q.tags = [m.el.querySelector('[name=critical]').checked && 'critical', m.el.querySelector('[name=problem]').checked && 'problem', q.img && 'image'].filter(Boolean);
      if (q.type === 'mcq') { q.opts = [...m.el.querySelectorAll('[data-opt]')].map((i) => i.value.trim()); const r = m.el.querySelector('[name=mcq-a]:checked'); q.a = r ? Number(r.value) : 0; }
      if (q.type === 'tf') { const r = m.el.querySelector('[name=tf-a]:checked'); q.a = r ? r.value === '1' : true; }
      if (q.type === 'fill') q.a = m.el.querySelector('[data-fill]').value.split('|').map((x) => x.trim()).filter(Boolean);
      if (q.type === 'num') q.a = App.parseNum(m.el.querySelector('[data-num]').value);
      if (q.type === 'match') q.pairs = [...m.el.querySelectorAll('[data-pl]')].map((i, k) => [i.value.trim(), m.el.querySelector(`[data-pr="${k}"]`).value.trim()]);

    };
    const preview = () => {
      collect();

      m.el.querySelector('[data-preview]').innerHTML = `<p><b>${t(pq.q || '…')}</b></p>${pq.img ? (pq.img.kind ? App.visual(pq.img) : `<img class="q-img" src="${esc(pq.img)}">`) : ''}<p class="muted">النوع: ${App.TYPE_NAMES[pq.type]}، المستوى: ${App.LEVEL_NAMES[pq.lvl]}</p><p>✅ ${t(App.correctText(pq) || '—')}</p><p class="exp">💡 ${t(pq.exp || '')}</p>`;
    };

    m.el.querySelectorAll('[name]').forEach((i) => { if (i.name !== 'type') i.addEventListener('input', preview); });
    m.el.querySelector('[data-addimg]').onclick = () => App.pickFile('image/*', (d) => App.resizeImage(d, 700, (s) => { q.img = s; m.el.querySelector('[data-img]').innerHTML = `<img class="q-img" src="${esc(s)}">`; preview(); }), true);
    m.el.querySelector('[data-rmimg]').onclick = () => { delete q.img; m.el.querySelector('[data-img]').innerHTML = ''; preview(); };
    typebox();
    m.el.querySelector('[data-save]').onclick = () => {
      collect();
      const err = (s) => App.toast(s, 'bad');
      if (!q.q) return err('اكتب نص السؤال');

      if (q.type === 'fill' && !q.a.length) return err('أدخل إجابة مقبولة واحدة على الأقل');
      if (q.type === 'num' && isNaN(q.a)) return err('الإجابة العددية غير صحيحة');
      if (q.type === 'match') { q.pairs = q.pairs.filter((p) => p[0] && p[1]); if (q.pairs.length < 2) return err('أدخل زوجين على الأقل'); }
      if (q.type === 'order') { q.items = q.items.filter(Boolean); if (q.items.length < 2) return err('أدخل عنصرين على الأقل'); }
      ['opts', 'pairs', 'items'].forEach((k) => { if ((k === 'opts' && q.type !== 'mcq') || (k === 'pairs' && q.type !== 'match') || (k === 'items' && q.type !== 'order')) delete q[k]; });
      if (!q.gid) q.id = 'c' + Date.now().toString(36);
      Content.saveQuestion(q); m.close(); App.toast('تم حفظ السؤال ✔', 'ok'); A.bank();
    };
  }

  /* ===================== الاختبارات (بما فيها المشتركة بين المواد) ===================== */
  /* بنية الاختبار: {id, title, gradeId, subjectIds[], scope:{mode:'term'|'chapters', term, chapterIds[]}, perSubject:{sid:n}, levels[], types[], timeLimit, passPct, feedback:'end'|'each', students[], active, note, series} */
  App.lessonIdsForTest = (x) => {
    const out = {};
    (x.subjectIds || []).forEach((sid) => {
      let chs = Content.chaptersOfSubject(sid);
      if (x.scope && x.scope.mode === 'term') chs = chs.filter((c) => (Content.get('units', c.unitId).term || 1) == x.scope.term);
      else if (x.scope && x.scope.mode === 'chapters') chs = chs.filter((c) => x.scope.chapterIds.includes(c.id));
      out[sid] = chs.flatMap((c) => Content.lessonsOfChapter(c.id)).map((l) => l.id);
    });
    return out;
  };
  App.questionsForTest = (x) => {
    const bySub = App.lessonIdsForTest(x);
    let qs = [];
    Object.entries(bySub).forEach(([sid, ids]) => {
      const n = (x.perSubject || {})[sid] || 5;
      qs = qs.concat(App.buildTest({ lessonIds: ids, count: n, levels: x.levels && x.levels.length ? x.levels : undefined, types: x.types && x.types.length ? x.types : undefined }));
    });
    return x.mix === false ? qs : App.shuffle(qs).sort((a, b) => a.lvl - b.lvl);
  };
  const scopeText = (x) => {
    if (!x.scope || x.scope.mode === 'all') return 'كل المقرر';
    if (x.scope.mode === 'term') return Content.termName(x.scope.term);
    return x.scope.chapterIds.map((id) => (Content.get('chapters', id) || {}).title).filter(Boolean).join(' + ');
  };

  A.tests = () => {
    const tests = Store.get('tests', []);
    const st = allStats();
    const body = shell('tests', `<div class="row between wrap gap"><p class="muted">أنشئ اختبارات لمادة واحدة أو مشتركة بين أكثر من مادة (مثل العلوم والرياضيات معاً)، لكل فصل دراسي أو لكل وحدة.</p>
      <span class="row wrap gap"><button class="btn primary" data-new>+ اختبار جديد</button><button class="btn" data-series>🔗 سلسلة اختبارات مشتركة لكل وحدة</button></span></div>
      ${tests.length ? `<table class="data-table"><thead><tr><th>الاختبار</th><th>الصف والمواد</th><th>النطاق</th><th>الأسئلة</th><th>المحاولات</th><th></th></tr></thead><tbody>${tests.map((x) => {
        const atts = st.attempts.filter((a) => a.testId === x.id); const avg = atts.length ? Math.round(atts.reduce((a, b) => a + b.pct, 0) / atts.length) : null;
        return `<tr class="${x.active === false ? 'off' : ''}"><td><b>${t(x.title)}</b>${x.active === false ? ' <span class="tag">موقوف</span>' : ''}${x.series ? ' <span class="tag">سلسلة</span>' : ''}</td><td><small>${t((Content.get('grades', x.gradeId) || {}).name || '')}<br>${t(x.subjectIds.map((s) => (Content.get('subjects', s) || {}).name).join(' + '))}</small></td><td><small>${t(scopeText(x))}</small></td><td>${N(Object.values(x.perSubject || {}).reduce((a, b) => a + b, 0))}${App.questionsForTest(x).length ? '' : '<br><span class="tag warn">لا أسئلة متاحة بعد — مخفي عن الطلاب</span>'}${x.timeLimit ? `<br><small>${N(x.timeLimit)} د</small>` : ''}</td><td>${N(atts.length)}${avg !== null ? `<br><small>متوسط ${N(avg)}٪</small>` : ''}</td>
        <td class="nowrap"><button class="xs btn ghost" data-res="${x.id}">النتائج</button><button class="xs btn ghost" data-edit="${x.id}">تعديل</button><button class="xs btn ghost" data-copy="${x.id}">نسخ</button><button class="xs btn ghost" data-toggle="${x.id}">${x.active === false ? 'تفعيل' : 'إيقاف'}</button><button class="xs btn ghost" data-print="${x.id}">🖨️</button><button class="xs btn danger ghost" data-del="${x.id}">حذف</button></td></tr>`; }).join('')}</tbody></table>` : '<div class="card center"><p class="muted">لا توجد اختبارات بعد. ابدأ بإنشاء اختبار أو سلسلة اختبارات مشتركة.</p></div>'}`);
    const save = (list) => { Store.set('tests', list); A.tests(); };
    body.querySelector('[data-new]').onclick = () => testForm();
    body.querySelector('[data-series]').onclick = () => seriesForm();
    body.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => testForm(tests.find((x) => x.id === b.dataset.edit)));
    body.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => { const x = JSON.parse(JSON.stringify(tests.find((y) => y.id === b.dataset.copy))); x.id = Content.newId('t'); x.title += ' (نسخة)'; save(tests.concat([x])); });
    body.querySelectorAll('[data-toggle]').forEach((b) => b.onclick = () => save(tests.map((x) => (x.id === b.dataset.toggle ? Object.assign(x, { active: x.active === false }) : x))));
    body.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => App.confirm('حذف هذا الاختبار؟ (تبقى محاولات الطلاب السابقة في سجلاتهم)', () => save(tests.filter((x) => x.id !== b.dataset.del))));
    body.querySelectorAll('[data-res]').forEach((b) => b.onclick = () => testResults(tests.find((x) => x.id === b.dataset.res)));
    body.querySelectorAll('[data-print]').forEach((b) => b.onclick = () => { const x = tests.find((y) => y.id === b.dataset.print); const ids = Object.values(App.lessonIdsForTest(x)).flat(); App.printWorksheet(ids, { levels: x.levels && x.levels.length ? x.levels : null }); });
  };

  function testForm(x) {
    const isNew = !x;
    x = x ? JSON.parse(JSON.stringify(x)) : { gradeId: Content.grades()[0].id, subjectIds: [], scope: { mode: 'term', term: App.settings().termNow, chapterIds: [] }, perSubject: {}, levels: [], types: [], timeLimit: 0, passPct: 60, feedback: 'end', students: [], active: true };
    const m = App.modal('<div data-f></div>', { wide: true, sticky: true });
    const draw = () => {
      const subs = Content.subjects(x.gradeId);
      x.subjectIds = x.subjectIds.filter((s) => subs.some((y) => y.id === s));
      const students = Progress.profiles().filter((p) => p.grade === x.gradeId);
      m.el.querySelector('[data-f]').innerHTML = `<h3>${isNew ? 'اختبار جديد' : 'تعديل الاختبار'}</h3><div class="form-grid">
        <label class="full">عنوان الاختبار<input name="title" value="${esc(x.title || '')}" placeholder="مثال: اختبار مشترك — الفصل الدراسي الثاني"></label>
        <label>الصف<select name="gradeId">${Content.grades().map((g) => `<option value="${g.id}" ${x.gradeId === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></label>
        <div><div class="lbl">المواد (اختر أكثر من مادة لاختبار مشترك)</div>${subs.map((s) => `<label class="check"><input type="checkbox" data-sub="${s.id}" ${x.subjectIds.includes(s.id) ? 'checked' : ''}> ${App.subjStyle(s).icon} ${esc(s.name)}</label>`).join('')}</div>
        <div class="full"><div class="lbl">نطاق الأسئلة</div>
          <label class="check"><input type="radio" name="mode" value="term" ${x.scope.mode === 'term' ? 'checked' : ''}> فصل دراسي كامل</label>
          <select name="term" ${x.scope.mode === 'term' ? '' : 'disabled'}>${[1, 2, 3].map((k) => `<option value="${k}" ${x.scope.term == k ? 'selected' : ''}>${Content.termName(k)}</option>`).join('')}</select>
          <label class="check"><input type="radio" name="mode" value="chapters" ${x.scope.mode === 'chapters' ? 'checked' : ''}> وحدات/فصول محددة</label>
          <label class="check"><input type="radio" name="mode" value="all" ${x.scope.mode === 'all' ? 'checked' : ''}> كل المقرر</label>
          ${x.scope.mode === 'chapters' ? `<div class="chap-pick">${x.subjectIds.map((sid) => `<div><b>${esc(Content.get('subjects', sid).name)}</b>${Content.units(sid).map((u) => `<div class="unit-pick"><small>${esc(u.title)}</small>${Content.chapters(u.id).map((c) => `<label class="check"><input type="checkbox" data-ch="${c.id}" ${x.scope.chapterIds.includes(c.id) ? 'checked' : ''}> ${esc(c.title)} <small>(${N(Content.lessonsOfChapter(c.id).reduce((a, l) => a + Content.questions(l.id).length, 0))} سؤال)</small></label>`).join('')}</div>`).join('')}</div>`).join('') || '<p class="muted">اختر المواد أولاً.</p>'}</div>` : ''}
        </div>
        <div class="full"><div class="lbl">عدد الأسئلة من كل مادة</div><div class="row wrap gap">${x.subjectIds.map((sid) => { const avail = Object.values(App.lessonIdsForTest({ subjectIds: [sid], scope: x.scope })).flat().reduce((a, l) => a + Content.questions(l).length, 0); return `<label>${esc(Content.get('subjects', sid).name)} <small>(متاح ${N(avail)})</small><input type="number" min="1" max="100" data-n="${sid}" value="${x.perSubject[sid] || 10}"></label>`; }).join('') || '<p class="muted">اختر مادة واحدة على الأقل.</p>'}</div></div>
        <div><div class="lbl">مستويات الصعوبة (فارغ = الكل)</div>${[1, 2, 3, 4].map((k) => `<label class="check"><input type="checkbox" data-lv="${k}" ${x.levels.includes(k) ? 'checked' : ''}> ${App.LEVEL_NAMES[k]}</label>`).join('')}</div>
        <div><div class="lbl">أنواع الأسئلة (فارغ = الكل)</div>${Object.entries(App.TYPE_NAMES).map(([k, n]) => `<label class="check"><input type="checkbox" data-ty="${k}" ${x.types.includes(k) ? 'checked' : ''}> ${n}</label>`).join('')}</div>
        <label>الوقت بالدقائق (0 = بدون وقت)<input type="number" name="timeLimit" min="0" value="${x.timeLimit || 0}"></label>
        <label>درجة النجاح ٪<input type="number" name="passPct" min="0" max="100" value="${x.passPct ?? 60}"></label>
        <label>عرض التصحيح<select name="feedback"><option value="end" ${x.feedback !== 'each' ? 'selected' : ''}>في نهاية الاختبار</option><option value="each" ${x.feedback === 'each' ? 'selected' : ''}>بعد كل سؤال (تدريبي)</option></select></label>
        <div class="full"><div class="lbl">الطلاب (لا تختر أحداً = لكل طلاب الصف)</div>${students.map((p) => `<label class="check"><input type="checkbox" data-st="${p.id}" ${x.students.includes(p.id) ? 'checked' : ''}> ${p.avatar} ${esc(p.name)}</label>`).join('') || '<p class="muted">لا يوجد طلاب في هذا الصف بعد.</p>'}</div>
        <label class="full">ملاحظة للطالب (اختياري)<input name="note" value="${esc(x.note || '')}"></label>
      </div><div class="row between"><button class="btn ghost" data-preview>👁️ معاينة الأسئلة</button><button class="btn primary" data-save>حفظ الاختبار</button></div>`;
      const F = m.el;
      const collect = () => {
        x.title = F.querySelector('[name=title]').value.trim();
        x.subjectIds = [...F.querySelectorAll('[data-sub]:checked')].map((i) => i.dataset.sub);
        x.scope.mode = F.querySelector('[name=mode]:checked').value; x.scope.term = Number(F.querySelector('[name=term]').value);
        if (x.scope.mode === 'chapters') x.scope.chapterIds = [...F.querySelectorAll('[data-ch]:checked')].map((i) => i.dataset.ch);
        x.perSubject = {}; F.querySelectorAll('[data-n]').forEach((i) => { x.perSubject[i.dataset.n] = Math.max(1, Number(i.value) || 1); });
        x.levels = [...F.querySelectorAll('[data-lv]:checked')].map((i) => Number(i.dataset.lv));
        x.types = [...F.querySelectorAll('[data-ty]:checked')].map((i) => i.dataset.ty);
        x.timeLimit = Number(F.querySelector('[name=timeLimit]').value) || 0; x.passPct = Number(F.querySelector('[name=passPct]').value) || 0;
        x.feedback = F.querySelector('[name=feedback]').value; x.students = [...F.querySelectorAll('[data-st]:checked')].map((i) => i.dataset.st);
        x.note = F.querySelector('[name=note]').value.trim();
      };
      F.querySelector('[name=gradeId]').onchange = (e) => { collect(); x.gradeId = e.target.value; x.subjectIds = []; x.students = []; draw(); };
      F.querySelectorAll('[data-sub],[name=mode]').forEach((i) => i.onchange = () => { collect(); draw(); });
      F.querySelector('[data-preview]').onclick = () => { collect(); const qs = App.questionsForTest(x); App.modal(`<h3>معاينة (${N(qs.length)} سؤالاً — تتغير عشوائياً في كل محاولة)</h3>${qs.map((q, k) => `<p>${N(k + 1)}. <span class="tag">${t(Content.path(q.lessonId).subject.name)}</span> <span class="tag lvl${q.lvl}">${App.LEVEL_NAMES[q.lvl]}</span> ${t(App.plain(q.q))}</p>`).join('') || '<p class="muted">لا توجد أسئلة تطابق الشروط.</p>'}`, { wide: true }); };
      F.querySelector('[data-save]').onclick = () => {
        collect();
        if (!x.title) return App.toast('اكتب عنوان الاختبار', 'bad');
        if (!x.subjectIds.length) return App.toast('اختر مادة واحدة على الأقل', 'bad');
        if (x.scope.mode === 'chapters' && !x.scope.chapterIds.length) return App.toast('اختر وحدة أو فصلاً واحداً على الأقل', 'bad');
        if (!App.questionsForTest(x).length) return App.toast('لا توجد أسئلة في النطاق المختار بعد', 'bad');
        const list = Store.get('tests', []);
        if (isNew) { x.id = Content.newId('t'); x.created = Date.now(); list.push(x); } else list.splice(list.findIndex((y) => y.id === x.id), 1, x);
        Store.set('tests', list); m.close(); App.toast('تم حفظ الاختبار ✔', 'ok'); A.tests();
      };
    };
    draw();
  }

  /* سلسلة اختبارات مشتركة: اختبار لكل وحدة/فصل بالترتيب، يجمع الوحدة رقم k من كل مادة */
  function seriesForm() {
    let gradeId = Content.grades()[0].id;
    const m = App.modal('<div data-f></div>', { wide: true, sticky: true });
    const draw = () => {
      const subs = Content.subjects(gradeId);
      m.el.querySelector('[data-f]').innerHTML = `<h3>🔗 سلسلة اختبارات مشتركة لكل وحدة</h3>
        <p class="muted">ننشئ اختباراً لكل وحدة بالترتيب: الاختبار الأول يجمع أول وحدة/فصل من كل مادة، والثاني يجمع الثاني... وهكذا. يمكنك تعديل أي اختبار بعد إنشائه.</p>
        <div class="form-grid">
        <label>الصف<select name="g">${Content.grades().map((g) => `<option value="${g.id}" ${g.id === gradeId ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></label>
        <label>الفصل الدراسي<select name="term">${Content.terms().map((k) => `<option value="${k}" ${k == App.settings().termNow ? 'selected' : ''}>${Content.termName(k)}</option>`).join('')}</select></label>
        <div><div class="lbl">المواد</div>${subs.map((s) => `<label class="check"><input type="checkbox" data-sub="${s.id}" checked> ${App.subjStyle(s).icon} ${esc(s.name)}</label>`).join('')}</div>
        <label>المطابقة حسب<select name="by"><option value="chapter">الفصل (فصل من كل مادة)</option><option value="unit">الوحدة (وحدة كاملة من كل مادة)</option></select></label>
        <label>عدد الأسئلة من كل مادة في كل اختبار<input type="number" name="n" value="8" min="1"></label>
        <label>الوقت بالدقائق (0 = بدون)<input type="number" name="time" value="0" min="0"></label>
        </div><div data-plan class="plan"></div><div class="row end"><button class="btn primary" data-go>إنشاء السلسلة</button></div>`;
      const F = m.el;
      const plan = () => {
        const term = Number(F.querySelector('[name=term]').value); const by = F.querySelector('[name=by]').value;
        const sids = [...F.querySelectorAll('[data-sub]:checked')].map((i) => i.dataset.sub);
        const lists = sids.map((sid) => {
          const units = Content.units(sid).filter((u) => (u.term || 1) == term);
          return by === 'unit' ? units.map((u) => ({ title: u.title.replace(/^(الفصل|الوحدة) \d+: /, ''), ids: Content.chapters(u.id).map((c) => c.id) })) : units.flatMap((u) => Content.chapters(u.id)).map((c) => ({ title: c.title.replace(/^الفصل \d+: /, ''), ids: [c.id] }));
        });
        const n = Math.max(0, ...lists.map((l) => l.length));
        const rows = []; for (let k = 0; k < n; k++) rows.push(sids.map((sid, j) => ({ sid, part: lists[j][k] })).filter((x) => x.part));
        return { rows, sids, term, by };
      };
      const showPlan = () => { const p = plan(); F.querySelector('[data-plan]').innerHTML = `<div class="lbl">الاختبارات التي ستُنشأ (${N(p.rows.length)})</div>` + p.rows.map((r, k) => `<p><b>${N(k + 1)}.</b> ${r.map((x) => `<span class="tag">${t(Content.get('subjects', x.sid).name)}: ${t(x.part.title)}</span>`).join(' + ')}</p>`).join(''); };
      F.querySelector('[name=g]').onchange = (e) => { gradeId = e.target.value; draw(); };
      F.querySelectorAll('[name=term],[name=by],[data-sub]').forEach((i) => i.onchange = showPlan);
      showPlan();
      F.querySelector('[data-go]').onclick = () => {
        const p = plan(); const n = Number(F.querySelector('[name=n]').value) || 8; const time = Number(F.querySelector('[name=time]').value) || 0;
        if (!p.rows.length) return App.toast('لا توجد وحدات في الفصل الدراسي المختار', 'bad');
        const sid0 = Content.newId('series'); const list = Store.get('tests', []);
        p.rows.forEach((r, k) => {
          const per = {}; r.forEach((x) => per[x.sid] = n);
          list.push({ id: Content.newId('t'), series: sid0, title: `اختبار مشترك ${k + 1}: ${r.map((x) => x.part.title).join(' + ')}`, gradeId, subjectIds: r.map((x) => x.sid), scope: { mode: 'chapters', term: p.term, chapterIds: r.flatMap((x) => x.part.ids) }, perSubject: per, levels: [], types: [], timeLimit: time, passPct: 60, feedback: 'end', students: [], active: true, created: Date.now() });
        });
        Store.set('tests', list); m.close(); App.toast(`أُنشئ ${p.rows.length} اختباراً مشتركاً ✔`, 'ok'); A.tests();
      };
    };
    draw();
  }

  function testResults(x) {
    const st = allStats();
    const atts = st.attempts.filter((a) => a.testId === x.id);
    const qAgg = {};
    atts.forEach((a) => a.answers.forEach((r) => { qAgg[r.gid] = qAgg[r.gid] || { c: 0, n: 0 }; qAgg[r.gid].n++; if (r.ok) qAgg[r.gid].c++; }));
    const hard = Object.entries(qAgg).map(([gid, s]) => ({ q: Content.question(gid), pct: Math.round(100 * s.c / s.n), n: s.n })).filter((y) => y.q).sort((a, b) => a.pct - b.pct).slice(0, 8);
    const subAgg = {};
    atts.forEach((a) => Object.entries(a.bySubject || {}).forEach(([sid, s]) => { subAgg[sid] = subAgg[sid] || { c: 0, t: 0 }; subAgg[sid].c += s.c; subAgg[sid].t += s.t; }));
    App.modal(`<h3>نتائج: ${t(x.title)}</h3>
      ${Object.keys(subAgg).length ? `<div class="pill-list">${Object.entries(subAgg).map(([sid, s]) => `<div class="pill-row"><b>${t(Content.get('subjects', sid).name)}</b><span>متوسط ${N(Math.round(100 * s.c / s.t))}٪</span></div>`).join('')}</div>` : ''}
      ${atts.length ? `<table class="data-table"><thead><tr><th>الطالب</th><th>التاريخ</th><th>النتيجة</th>${x.subjectIds.map((s) => `<th>${t(Content.get('subjects', s).name)}</th>`).join('')}<th>المدة</th></tr></thead><tbody>${atts.map((a) => `<tr><td>${a.student.avatar} ${t(a.student.name)}</td><td>${App.fmtDate(a.date)}</td><td><b>${N(a.pct)}٪</b> ${a.pct >= (x.passPct || 0) ? '✔' : '✖'}</td>${x.subjectIds.map((s) => { const b = (a.bySubject || {})[s]; return `<td>${b ? N(b.c) + '/' + N(b.t) : '—'}</td>`; }).join('')}<td>${N(Math.round((a.duration || 0) / 60))} د</td></tr>`).join('')}</tbody></table>` : '<p class="muted">لم يؤدِّ أحد هذا الاختبار بعد.</p>'}
      ${hard.length ? `<h3>الأسئلة الأصعب</h3>${hard.map((h) => `<p>${N(h.pct)}٪ صحيح — ${t(App.plain(h.q.q).slice(0, 100))}</p>`).join('')}` : ''}
      <div class="row end"><button class="btn ghost" data-csv>📤 تصدير CSV</button></div>`, { wide: true }).el.querySelector('[data-csv]').onclick = () => {
      const rows = [['الطالب', 'التاريخ', 'الصحيح', 'العدد', 'النسبة'].concat(x.subjectIds.map((s) => Content.get('subjects', s).name))].concat(atts.map((a) => [a.student.name, new Date(a.date).toISOString().slice(0, 10), a.correct, a.total, a.pct].concat(x.subjectIds.map((s) => { const b = (a.bySubject || {})[s]; return b ? `${b.c}/${b.t}` : ''; }))));
      App.download(`نتائج-${x.title}.csv`, '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\n'), 'text/csv;charset=utf-8');
    };
  }

  /* ===================== الطلاب ===================== */
  A.students = () => {
    const st = allStats();
    const body = shell('students', `<div class="row between wrap gap"><p class="muted">كل طالب يُحفظ تقدمه على هذا الجهاز. لطلاب على أجهزة أخرى: اطلب منهم «تصدير ملف نتائجي» ثم استورده هنا.</p><span class="row gap"><button class="btn primary" data-add>+ طالب</button><button class="btn ghost" data-import>📥 استيراد نتائج طالب</button></span></div>
      <table class="data-table"><thead><tr><th>الطالب</th><th>الصف</th><th>النقاط</th><th>الاختبارات</th><th>متوسط الدرجات</th><th>دقة الإجابات</th><th>آخر نشاط</th><th></th></tr></thead><tbody>
      ${st.per.map(({ p, g, tot }) => `<tr><td>${p.avatar} <b>${t(p.name)}</b></td><td>${t((Content.get('grades', p.grade) || {}).name || '')}</td><td>${N(g.points)}</td><td>${N(tot.tests)}</td><td>${N(tot.avg)}٪</td><td>${N(tot.pct)}٪ <small>(${N(tot.c)}✔ ${N(tot.w)}✖)</small></td><td><small>${g.streak.last ? App.fmtDate(g.streak.last) : '—'}</small></td><td class="nowrap"><button class="xs btn" data-view="${p.id}">التفاصيل</button><button class="xs btn ghost" data-edit="${p.id}">تعديل</button><button class="xs btn ghost" data-pin="${p.id}">مسح الرمز</button></td></tr>`).join('') || '<tr><td colspan="8" class="muted">لا يوجد طلاب بعد.</td></tr>'}</tbody></table>`);
    body.querySelector('[data-add]').onclick = () => App.profileForm(null, { admin: true });
    body.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => App.profileForm(Progress.profile(b.dataset.edit), { admin: true }));
    body.querySelectorAll('[data-pin]').forEach((b) => b.onclick = () => { const p = Progress.profile(b.dataset.pin); delete p.pin; Progress.updateProfile(p); App.toast('تم مسح رمز الطالب'); });
    body.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => studentDetail(b.dataset.view));
    body.querySelector('[data-import]').onclick = () => App.pickFile('.json,application/json', (text) => {
      try {
        const d = JSON.parse(text);
        if (d.type !== 'student-results') throw new Error();
        const existing = Progress.profile(d.profile.id);
        const apply = () => {
          if (!existing) { const list = Progress.profiles(); list.push(d.profile); Progress.saveProfiles(list); }
          const cur = Progress.get(d.profile.id);
          const merged = Object.assign({}, d.progress);
          const ids = new Set(d.progress.attempts.map((a) => a.id));
          merged.attempts = d.progress.attempts.concat((cur.attempts || []).filter((a) => !ids.has(a.id))).sort((a, b) => a.date - b.date);
          Progress.save(d.profile.id, merged); App.toast(`تم استيراد نتائج ${d.profile.name} ✔`, 'ok'); A.students();
        };
        if (existing) App.confirm(`الطالب ${d.profile.name} موجود. هل تريد تحديث تقدمه من الملف (مع دمج سجل الاختبارات)؟`, apply); else apply();
      } catch (e) { App.toast('الملف ليس ملف نتائج صالحاً.', 'bad'); }
    });
  };
  function studentDetail(pid) {
    const p = Progress.profile(pid); const g = Progress.get(pid);
    const acc = Progress.lessonAccuracy(pid).sort((a, b) => a.pct - b.pct);
    App.modal(`<h3>${p.avatar} ${t(p.name)}</h3><div class="subj-progress">${Content.subjects(p.grade).map((s) => `<div class="sp"><b>${t(s.name)}</b>${App.ring(Progress.subjectPct(pid, s.id), 64)}</div>`).join('')}</div>
      <h3>تطور المستوى</h3>${App.lineChart(g.attempts.slice(-15).map((a) => ({ v: a.pct, label: a.title })))}
      <h3>دقة الإجابات حسب الدرس</h3>${acc.map((x) => `<div class="list-row"><span>${t(Content.get('lessons', x.lid).title)}</span><b class="${x.pct < 60 ? 'bad-text' : 'ok-text'}">${N(x.pct)}٪ <small>(${N(x.c)}✔ ${N(x.w)}✖)</small></b></div>`).join('') || '<p class="muted">لا توجد إجابات بعد.</p>'}
      <h3>سجل الاختبارات</h3>${g.attempts.length ? `<table class="data-table"><tbody>${g.attempts.slice().reverse().map((a) => `<tr><td>${t(a.title)}</td><td>${App.fmtDate(a.date)}</td><td>${N(a.correct)}/${N(a.total)} (${N(a.pct)}٪)</td></tr>`).join('')}</tbody></table>` : '<p class="muted">لا توجد اختبارات.</p>'}
      <p class="muted">أسئلة في دفتر الأخطاء: ${N(Object.keys(g.mistakes).length)}، الشارات: ${Object.keys(g.badges).map((b) => Progress.BADGES[b].icon).join(' ') || '—'}</p>`, { wide: true });
  }

  /* ===================== التقارير ===================== */
  A.reports = () => {
    const st = allStats();
    const grades = Content.grades();
    const bySubject = {};
    st.lessons.forEach((x) => { const pth = Content.path(x.lid); const sid = pth.subject.id; bySubject[sid] = bySubject[sid] || { c: 0, w: 0 }; bySubject[sid].c += x.c; bySubject[sid].w += x.w; });
    const body = shell('reports', `${grades.map((gr) => { const subs = Content.subjects(gr.id); const studs = st.per.filter((x) => x.p.grade === gr.id); return `<section class="card"><h2>${t(gr.name)} <small>(${N(studs.length)} طالب)</small></h2>
      <div class="subj-progress">${subs.map((s) => { const a = bySubject[s.id]; const avgProg = studs.length ? studs.reduce((acc, x) => acc + Progress.subjectPct(x.p.id, s.id), 0) / studs.length : 0; return `<div class="sp"><b>${App.subjStyle(s).icon} ${t(s.name)}</b>${App.ring(avgProg, 64)}<small>متوسط الإنجاز</small><small>${a ? `دقة ${N(Math.round(100 * a.c / (a.c + a.w)))}٪، ${N(a.c)}✔ ${N(a.w)}✖` : 'لا إجابات'}</small></div>`; }).join('')}</div>
      <h3>الدروس حسب مستوى الطلاب</h3>${(() => { const ls = st.lessons.filter((x) => Content.path(x.lid).grade.id === gr.id).sort((a, b) => a.pct - b.pct); return ls.length ? `<table class="data-table"><thead><tr><th>الدرس</th><th>المادة</th><th>صحيح</th><th>خطأ</th><th>الدقة</th></tr></thead><tbody>${ls.map((x) => `<tr><td>${t(Content.get('lessons', x.lid).title)}</td><td>${t(Content.path(x.lid).subject.name)}</td><td>${N(x.c)}</td><td>${N(x.w)}</td><td><b class="${x.pct < 60 ? 'bad-text' : x.pct >= 80 ? 'ok-text' : ''}">${N(x.pct)}٪</b></td></tr>`).join('')}</tbody></table>` : '<p class="muted">لا توجد بيانات بعد.</p>'; })()}</section>`; }).join('')}
      <div class="row wrap gap"><button class="btn primary" data-csv>📤 تصدير تقرير الطلاب (CSV / Excel)</button><button class="btn ghost" onclick="window.print()">🖨️ طباعة</button></div>`);
    body.querySelector('[data-csv]').onclick = () => {
      const rows = [['الطالب', 'الصف', 'النقاط', 'عدد الاختبارات', 'متوسط الدرجات %', 'إجابات صحيحة', 'إجابات خاطئة', 'نسبة الصحيح %'].concat(...grades.map((g) => Content.subjects(g.id).map((s) => `إنجاز ${s.name} (${g.name}) %`)))];
      st.per.forEach(({ p, g, tot }) => rows.push([p.name, (Content.get('grades', p.grade) || {}).name, g.points, tot.tests, tot.avg, tot.c, tot.w, tot.pct].concat(...grades.map((gr) => Content.subjects(gr.id).map((s) => (p.grade === gr.id ? Math.round(Progress.subjectPct(p.id, s.id)) : ''))))));
      App.download(`تقرير-الطلاب-${App.today()}.csv`, '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\n'), 'text/csv;charset=utf-8');
    };
  };

  /* ===================== الإعدادات والنسخ الاحتياطي ===================== */
  A.settings = () => {
    const s = App.settings();
    const body = shell('settings', `<section class="card"><h2>نسبة النجاح للانتقال بين المستويات</h2><div class="row wrap gap">${[1, 2, 3, 4].map((k) => `<label>${App.LEVEL_NAMES[k]} ٪<input type="number" min="0" max="100" data-pass="${k}" value="${s.passPct[k]}"></label>`).join('')}</div></section>
      <section class="card form-grid"><h2 class="full">إعدادات عامة</h2>
        <label>الفصل الدراسي الحالي<select data-k="termNow">${[1, 2, 3].map((k) => `<option value="${k}" ${s.termNow == k ? 'selected' : ''}>${Content.termName(k)}</option>`).join('')}</select></label>
        <label>عدد أسئلة التحدي اليومي<input type="number" min="3" max="20" data-k="dailyCount" value="${s.dailyCount}"></label>
        <label>تذكير بالاستراحة كل (دقيقة، 0 = إيقاف)<input type="number" min="0" max="120" data-k="breakMins" value="${s.breakMins}"></label>
        <label class="check"><input type="checkbox" data-k="leaderboard" ${s.leaderboard ? 'checked' : ''}> إظهار لوحة المتصدرين للطلاب</label></section>
      <section class="card"><h2>رمز المشرف</h2><div class="row wrap gap"><input type="password" inputmode="numeric" placeholder="الرمز الجديد" data-np><button class="btn ghost" data-chpin>تغيير الرمز</button></div></section>
      <section class="card"><h2>💾 النسخ الاحتياطي</h2><p class="muted">البيانات محفوظة داخل هذا المتصفح (${Store.backend()}). صدّر نسخة احتياطية بانتظام، خاصة قبل مسح بيانات المتصفح.</p>
        <div class="row wrap gap"><button class="btn primary" data-backup>📤 تصدير نسخة احتياطية كاملة</button><button class="btn ghost" data-restore>📥 استعادة من نسخة احتياطية</button><button class="btn danger ghost" data-reset>🗑️ مسح كل البيانات</button></div></section>
      <section class="card"><h2>عن المحتوى</h2><p>الفهارس مستخرجة من كتب الطالب (الجزء الثاني، طبعة 1448هـ) للرياضيات والعلوم. الدروس المشروحة تحمل علامة «مراجَع من الكتاب» مع رقم الصفحة. الدروس الأخرى تظهر بعلامة «قريباً» حتى يُضاف شرحها.</p></section>`);
    const save = () => {
      const s2 = App.settings();
      body.querySelectorAll('[data-pass]').forEach((i) => s2.passPct[i.dataset.pass] = Math.min(100, Math.max(0, Number(i.value) || 0)));
      body.querySelectorAll('[data-k]').forEach((i) => s2[i.dataset.k] = i.type === 'checkbox' ? i.checked : Number(i.value));
      App.saveSettings(s2); App.toast('تم الحفظ ✔', 'ok');
    };
    body.querySelectorAll('[data-pass],[data-k]').forEach((i) => i.onchange = save);
    body.querySelector('[data-chpin]').onclick = () => { const v = body.querySelector('[data-np]').value.trim(); if (v.length < 4) return App.toast('4 أرقام على الأقل', 'bad'); const s2 = App.settings(); s2.adminPin = App.hash(v); App.saveSettings(s2); App.toast('تم تغيير الرمز ✔', 'ok'); body.querySelector('[data-np]').value = ''; };
    body.querySelector('[data-backup]').onclick = () => App.download(`نسخة-احتياطية-منصة-نجيب-${App.today()}.json`, JSON.stringify({ type: 'full-backup', version: 1, date: Date.now(), data: Store.dump() }));
    body.querySelector('[data-restore]').onclick = () => App.pickFile('.json,application/json', (text) => {
      try { const d = JSON.parse(text); if (d.type !== 'full-backup') throw new Error(); App.confirm('ستُستبدل كل البيانات الحالية بالنسخة الاحتياطية. متابعة؟', () => { Store.restore(d.data); Content._cache = null; App.adminOK = false; App.toast('تمت الاستعادة ✔', 'ok'); App.go('profiles'); App.applyPrefs(); }); }
      catch (e) { App.toast('ملف النسخة الاحتياطية غير صالح.', 'bad'); }
    });
    body.querySelector('[data-reset]').onclick = () => App.confirm('سيتم حذف كل الطلاب والنتائج والتعديلات نهائياً. هل صدّرت نسخة احتياطية؟', () => { Store.restore({}); Content._cache = null; App.adminOK = false; App.go('profiles'); });
  };
})();

</script>
  <script>/* js/app.js */
/* التشغيل والتنقل */
(function () {
  const App = window.App;
  App.views = App.views || {};
  App.route = { view: 'profiles', args: [] };

  App.go = (view, ...args) => {
    const h = '#/' + [view].concat(args.map((a) => encodeURIComponent(a))).join('/');
    if (location.hash === h) render(); else location.hash = h;
  };

  const NAV = [['home', '🏠', 'الرئيسية'], ['tests', '🧪', 'اختباراتي'], ['mistakes', '📝', 'أخطائي'], ['progress', '📈', 'تقدمي'], ['tools', '🧰', 'أدواتي'], ['settings', '⚙️', 'الإعدادات']];

  App.renderChrome = () => {
    const p = Progress.current();
    const inAdmin = App.route.view === 'admin';
    const g = p ? Progress.get(p.id) : null;
    document.getElementById('topbar').innerHTML = `<a class="brand" href="#/${p ? 'home' : 'profiles'}">${App.mascot('happy', 40)}<span>نجيب<small>معلّمك الذكي</small></span></a>
      ${p && !inAdmin ? `<nav class="topnav">${NAV.map(([v, i, n]) => `<a href="#/${v}" class="${App.route.view === v ? 'on' : ''}">${i} ${n}</a>`).join('')}</nav>
      <button class="chip" data-me><span class="avatar sm" style="background:${p.color}">${p.avatar}</span><b>${App.t(p.name)}</b><span class="pts">⭐ ${App.num(g.points)}</span></button>` : ''}`;
    const bn = document.getElementById('bottomnav');
    bn.innerHTML = p && !inAdmin ? NAV.filter((x) => x[0] !== 'tools').map(([v, i, n]) => `<a href="#/${v}" class="${App.route.view === v ? 'on' : ''}"><span>${i}</span>${n}</a>`).join('') : '';
    bn.hidden = !(p && !inAdmin);
    const me = document.querySelector('[data-me]');
    if (me) me.onclick = () => App.go('settings');
  };

  function render() {
    if (window.speechSynthesis) speechSynthesis.cancel();
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    let view = parts[0] || '';
    const args = parts.slice(1);
    const p = Progress.current();
    if (view !== 'admin' && view !== 'profiles' && !p) view = 'profiles';
    if (!view) view = p ? 'home' : 'profiles';
    if (!App.views[view]) view = p ? 'home' : 'profiles';
    App.route = { view, args };
    App.renderChrome();
    document.querySelectorAll('.modal-wrap').forEach((m) => m.remove());
    try { App.views[view](...args); }
    catch (e) { console.error(e); document.getElementById('main').innerHTML = `<section class="card center"><h2>حدث خطأ غير متوقع</h2><p class="muted">${App.esc(e.message)}</p><a class="btn primary" href="#/home">العودة للرئيسية</a></section>`; }
    App.renderChrome();
    window.scrollTo(0, 0);
  }
  App.render = render;

  /* تذكير الاستراحة */
  setInterval(() => {
    const s = App.settings(); const p = Progress.current();
    if (!p || !s.breakMins || !App.sessionStart) return;
    if (Date.now() - App.sessionStart > s.breakMins * 60000) {
      App.sessionStart = Date.now();
      App.modal(`<div class="center">${App.mascot('happy', 110)}<h2>وقت الاستراحة! 🌿</h2><p>تعلمت لمدة ${App.num(s.breakMins)} دقيقة. قم، تمدد، اشرب ماءً، وأرح عينيك بالنظر بعيداً قليلاً، ثم عد بنشاط!</p></div>`);
    }
  }, 30000);

  async function init() {
    await Store.init();
    App.applyPrefs();
    App.sessionStart = Date.now();
    window.addEventListener('hashchange', render);
    window.addEventListener('afterprint', () => { document.getElementById('print-area').innerHTML = ''; });
    render();
    // التثبيت كتطبيق عند التشغيل من خادم (لا يعمل مع file://)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  init();
})();

</script>
