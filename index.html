:root {
  --fs: 1;
  --bg: #f5fbff; --surface: #ffffff; --surface2: #f1f7fb; --ink: #12304a; --muted: #5b7083; --line: #dbe8f1;
  --sky: #0ea5e9; --sky-l: #e0f2fe; --green: #10b981; --green-l: #dcfce7; --teal: #14b8a6; --teal-l: #ccfbf1; --violet: #8b5cf6; --violet-l: #ede9fe;
  --amber: #f59e0b; --red: #ef4444; --red-l: #fee2e2;
  --r: 18px; --shadow: 0 6px 22px rgba(14, 80, 130, .08);
  --lh: 1.75;
}
html[data-theme=dark] { --bg: #0d1b2a; --surface: #13263a; --surface2: #183049; --ink: #e6f1fa; --muted: #9db3c6; --line: #24425f; --sky-l: #0c3550; --green-l: #0d3b2e; --teal-l: #0c3a37; --violet-l: #2b2450; --red-l: #4a1d1d; --shadow: 0 6px 22px rgba(0, 0, 0, .3); }
html.spacious { --lh: 2.1; letter-spacing: .02em; word-spacing: .12em; }
html.contrast { --ink: #000; --muted: #1f2937; --line: #6b7280; }
html[data-theme=dark].contrast { --ink: #fff; --muted: #e5e7eb; }

* { box-sizing: border-box; }
html { font-size: calc(17px * var(--fs)); scroll-behavior: smooth; }
body { margin: 0; font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--ink); line-height: var(--lh); min-height: 100vh; padding-bottom: 80px;
  background-image: radial-gradient(circle at 10% 0%, rgba(14,165,233,.07), transparent 40%), radial-gradient(circle at 90% 20%, rgba(139,92,246,.06), transparent 35%); }
h1, h2, h3 { line-height: 1.4; margin: .2em 0 .5em; }
h1 { font-size: 1.6rem; font-weight: 800; } h2 { font-size: 1.25rem; font-weight: 800; } h3 { font-size: 1.05rem; font-weight: 700; }
a { color: var(--sky); } .link { font-weight: 700; }
small { color: var(--muted); }
.muted { color: var(--muted); } .center { text-align: center; } .ok-text { color: var(--green); font-weight: 700; } .bad-text { color: var(--red); font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: .55rem .8rem; min-height: 46px; width: 100%; transition: border-color .2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sky); box-shadow: 0 0 0 4px rgba(14,165,233,.15); }
input[type=checkbox], input[type=radio] { width: 22px; min-height: 22px; height: 22px; accent-color: var(--sky); }
input[type=range] { padding: 0; border: 0; accent-color: var(--sky); }
label { display: block; font-weight: 700; font-size: .92rem; }
label.check { display: inline-flex; align-items: center; gap: .5rem; font-weight: 500; margin-inline-end: 1rem; cursor: pointer; }
.lbl { font-weight: 700; font-size: .92rem; margin: .4rem 0; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

/* ===== الأزرار ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: 0; border-radius: 14px; padding: .6rem 1.2rem; min-height: 48px; font-weight: 800; cursor: pointer; text-decoration: none; background: var(--sky-l); color: #0369a1; transition: transform .12s, box-shadow .2s, background .2s; }
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0) scale(.98); }
.btn.primary { background: linear-gradient(135deg, #0ea5e9, #14b8a6); color: #fff; box-shadow: 0 6px 16px rgba(14,165,233,.3); }
.btn.ghost { background: var(--surface); border: 2px solid var(--line); color: var(--ink); }
.btn.danger { background: var(--red); color: #fff; } .btn.danger.ghost { background: transparent; color: var(--red); border-color: #fecaca; }
.btn.big { font-size: 1.15rem; min-height: 58px; padding: .7rem 2rem; }
.btn.sm { min-height: 38px; padding: .3rem .8rem; font-size: .9rem; }
.btn.xs { min-height: 30px; padding: .15rem .6rem; font-size: .8rem; border-radius: 9px; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
html[data-theme=dark] .btn { color: #bae6fd; } html[data-theme=dark] .btn.primary { color: #fff; }
.mini { border: 0; background: var(--surface2); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
.speak { border: 0; background: var(--sky-l); border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: .95rem; vertical-align: middle; }

/* ===== الهيكل ===== */
#topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 1rem; padding: .5rem 1.2rem; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .5rem; text-decoration: none; color: var(--ink); font-weight: 800; font-size: 1.3rem; }
.brand small { display: block; font-size: .7rem; font-weight: 500; margin-top: -6px; }
.topnav { display: flex; gap: .2rem; margin-inline-start: auto; flex-wrap: wrap; }
.topnav a { text-decoration: none; color: var(--muted); font-weight: 700; padding: .45rem .8rem; border-radius: 12px; font-size: .92rem; }
.topnav a.on, .topnav a:hover { background: var(--sky-l); color: #0369a1; }
.chip { display: flex; align-items: center; gap: .5rem; border: 2px solid var(--line); background: var(--surface); border-radius: 99px; padding: .25rem .4rem .25rem .9rem; cursor: pointer; }
.pts { background: #fef3c7; color: #92400e; border-radius: 99px; padding: 0 .6rem; font-weight: 800; font-size: .85rem; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; width: 42px; height: 42px; font-size: 1.4rem; background: var(--sky-l); }
.avatar.sm { width: 30px; height: 30px; font-size: 1rem; } .avatar.big { width: 76px; height: 76px; font-size: 2.6rem; }
main { max-width: 1100px; margin: 0 auto; padding: 1.2rem 1rem 2rem; }
#bottomnav { display: none; }
.card { background: var(--surface); border-radius: var(--r); padding: 1.2rem 1.4rem; box-shadow: var(--shadow); border: 1px solid var(--line); margin-bottom: 1rem; }
.card.narrow { max-width: 440px; margin: 2rem auto; } .card.narrow .ans-input { margin: .4rem 0; }
.row { display: flex; align-items: center; gap: .6rem; } .row.wrap { flex-wrap: wrap; } .row.gap { gap: .6rem; } .row.end { justify-content: flex-end; margin-top: 1rem; } .row.between { justify-content: space-between; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; } .two-col > .card { margin: 0; }
.sec-title { margin-top: 1.5rem; }
.crumbs { font-size: .9rem; color: var(--muted); margin-bottom: .6rem; } .crumbs a { text-decoration: none; font-weight: 700; }
.tag { display: inline-block; background: var(--surface2); color: var(--muted); border-radius: 99px; padding: .05rem .65rem; font-size: .78rem; font-weight: 700; border: 1px solid var(--line); }
.tag.ok { background: var(--green-l); color: #047857; border-color: transparent; } .tag.warn { background: #fef3c7; color: #92400e; border-color: transparent; }
.tag.lvl1 { background: var(--sky-l); color: #0369a1; } .tag.lvl2 { background: var(--teal-l); color: #0f766e; } .tag.lvl3 { background: var(--green-l); color: #047857; } .tag.lvl4 { background: var(--violet-l); color: #6d28d9; }
.bar { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, #14b8a6, #0ea5e9); border-radius: 99px; transition: width .5s; }
.bar.thin { height: 6px; margin-top: .3rem; }
.list-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .7rem 0; border-bottom: 1px dashed var(--line); } .list-row:last-child { border: 0; }
.list-row small { display: block; } .list-row.me { background: var(--sky-l); border-radius: 12px; padding-inline: .6rem; }

/* ===== الشخصية والبطل ===== */
.mascot { flex-shrink: 0; overflow: visible; }
.mascot.cheer { animation: bounce 1s ease-in-out infinite alternate; } .mascot .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes bounce { to { transform: translateY(-6px); } } @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.hero { display: flex; align-items: center; gap: 1.2rem; background: linear-gradient(135deg, var(--sky-l), var(--teal-l)); border-radius: 26px; padding: 1.2rem 1.6rem; margin-bottom: 1.2rem; }
.hero h1 { margin-bottom: .2rem; }
.bubble { background: var(--surface); border-radius: 22px; padding: 1rem 1.3rem; position: relative; box-shadow: var(--shadow); flex: 1; }
.bubble::before { content: ''; position: absolute; right: -10px; top: 40%; border: 12px solid transparent; border-left-color: var(--surface); border-right: 0; transform: scaleX(-1); right: auto; left: 100%; }
.bubble p { margin: .2rem 0 0; }

/* ===== الملفات الشخصية ===== */
.profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
.profile-card { display: flex; flex-direction: column; align-items: center; gap: .4rem; background: var(--surface2); border: 2px solid transparent; border-radius: 20px; padding: 1.2rem .6rem; cursor: pointer; transition: .2s; }
.profile-card:hover { border-color: var(--sky); transform: translateY(-3px); } .profile-card.add { border: 2px dashed var(--line); }
.avatar-pick, .color-pick { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .6rem; }
.avatar-pick button { font-size: 1.6rem; width: 50px; height: 50px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }

/* ===== الإحصاءات ===== */

/* ===== بطاقات المواد ===== */

.s-icon { font-size: 2.3rem; background: rgba(255,255,255,.25); width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; flex-shrink: 0; }
.sky { background: linear-gradient(135deg, #38bdf8, #0284c7); } .green { background: linear-gradient(135deg, #34d399, #059669); } .violet { background: linear-gradient(135deg, #a78bfa, #7c3aed); } .teal { background: linear-gradient(135deg, #2dd4bf, #0d9488); }
.ring text { fill: currentColor; } .subject-card .ring circle:first-child, .subject-head .ring circle:first-child, .lesson-head .ring circle:first-child { stroke: rgba(255,255,255,.35); }
.cards-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1rem; }

/* ===== المادة والمسار ===== */

.subject-head h1, .lesson-head h1 { margin: 0; } .subject-head p, .lesson-head p { margin: 0; opacity: .95; } .subject-head > div, .lesson-head > div { flex: 1; }
.lesson-head small { color: rgba(255,255,255,.9); } .lesson-head .src { font-size: .9rem; margin-top: .3rem; }
.unit { margin: 1.4rem 0; } .unit-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-bottom: 3px solid var(--sky-l); margin-bottom: .6rem; }
.chapter-title { color: var(--muted); margin-top: 1rem; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.path { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .7rem; }
.lesson-node { display: flex; align-items: center; gap: .8rem; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: .75rem .9rem; text-decoration: none; color: var(--ink); transition: .2s; }
.lesson-node:hover { border-color: var(--sky); transform: translateX(-3px); }

.ln-num { background: var(--sky-l); color: #0369a1; font-weight: 800; border-radius: 12px; min-width: 52px; height: 44px; display: grid; place-items: center; font-size: .9rem; }
.ln-body { flex: 1; } .ln-body b { display: block; line-height: 1.35; } .stars i { color: #cbd5e1; font-style: normal; } .stars i.on { color: #f59e0b; }
.soon-tag { white-space: nowrap; }

/* ===== الدرس ===== */
.toc { display: flex; gap: .4rem; overflow-x: auto; padding: .3rem 0 .8rem; position: sticky; top: 62px; z-index: 5; background: var(--bg); }
.toc a { white-space: nowrap; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: .25rem .9rem; font-size: .85rem; font-weight: 700; color: var(--muted); }

.lesson-sec h2 { display: flex; align-items: center; gap: .6rem; }
.sec-n { background: linear-gradient(135deg, #0ea5e9, #8b5cf6); color: #fff; border-radius: 10px; width: 32px; height: 32px; display: grid; place-items: center; font-size: .95rem; flex-shrink: 0; }
.goals, .keys { list-style: none; padding: 0; margin: 0; } .goals li, .keys li { padding: .4rem 0; }
.keys li { background: #fefce8; border-radius: 12px; padding: .55rem .9rem; margin-bottom: .4rem; } html[data-theme=dark] .keys li { background: #3a3410; }

.step h3 { margin: 0 0 .3rem; } .step p { margin: 0; }
.alt { display: flex; gap: 1rem; align-items: center; background: #fff7ed; border-radius: 16px; padding: 1rem; margin-top: .8rem; animation: pop .3s; } html[data-theme=dark] .alt { background: #3b2a16; }
.example { background: var(--surface2); border-radius: 14px; padding: .7rem 1rem; margin-bottom: .6rem; } .example summary { cursor: pointer; font-weight: 700; } .example p { margin: .5rem 0 0; }
.life { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .6rem; } .life span { background: var(--green-l); border-radius: 99px; padding: .3rem .9rem; font-size: .92rem; }

.big-eq { font-size: 1.5rem; font-weight: 800; text-align: center; margin: .4rem 0; }
.fbar { display: flex; gap: 3px; margin: .6rem 0; } .fbar i { flex: 1; height: 40px; background: var(--surface); border: 2px solid var(--violet); border-radius: 6px; } .fbar i.on { background: var(--violet); }
.fbar.half i { border-color: var(--teal); height: 18px; } .fbar.half i.on { background: var(--teal-l); }
.thermo-tool { display: flex; gap: 1rem; align-items: center; } .thermo-tool > div:last-child { flex: 1; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; margin: 1rem 0; }
.level-card { display: flex; flex-direction: column; align-items: center; gap: .2rem; border: 0; border-radius: 20px; padding: 1rem .6rem; cursor: pointer; transition: .2s; text-align: center; }
.level-card.lvl1 { background: var(--sky-l); } .level-card.lvl2 { background: var(--teal-l); } .level-card.lvl3 { background: var(--green-l); } .level-card.lvl4 { background: var(--violet-l); }
.level-card:hover:not(:disabled) { transform: translateY(-4px); box-shadow: var(--shadow); } .level-card.locked { filter: grayscale(.8); opacity: .65; cursor: not-allowed; }
.lv-n { width: 46px; height: 46px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 800; font-size: 1.2rem; }
.level-card.passed .lv-n { background: var(--green); color: #fff; } .level-card .need { font-size: .75rem; line-height: 1.4; }

/* ===== الأسئلة ===== */
.quiz { max-width: 820px; margin: 0 auto; }
.quiz-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-bottom: .6rem; }
.q-title { text-align: center; } .q-title small { display: block; } .q-count, .timer { font-weight: 800; background: var(--surface2); border-radius: 99px; padding: .2rem .9rem; }
.timer { background: #fef3c7; color: #92400e; }
.q-meta { display: flex; gap: .4rem; margin: .8rem 0 .4rem; flex-wrap: wrap; }
.q-text { font-size: 1.25rem; font-weight: 700; margin: .6rem 0 1rem; }
.q-img { max-width: 100%; max-height: 300px; border-radius: 14px; display: block; margin: .5rem auto; }
.opts { display: grid; gap: .6rem; } .opts.tf { grid-template-columns: 1fr 1fr; }

.match-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .6rem; margin-bottom: .6rem; }
.match-l { background: var(--violet-l); border-radius: 12px; padding: .6rem .9rem; font-weight: 700; } .match-arrow { color: var(--muted); }
.order { list-style: none; padding: 0; counter-reset: o; } .order li { display: flex; align-items: center; justify-content: space-between; gap: .6rem; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: .55rem .9rem; margin-bottom: .5rem; counter-increment: o; }
.order li::before { content: counter(o, arabic-indic); background: var(--teal-l); color: #0f766e; font-weight: 800; border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; flex-shrink: 0; }
.order li > span:first-child { flex: 1; } .ord-btns { display: flex; gap: .3rem; }
.locked .order li, .locked .opt { cursor: default; }
.hint-box { background: #fefce8; border-radius: 14px; padding: .6rem 1rem; margin-top: 1rem; } .hint-box p { margin: .3rem 0; } html[data-theme=dark] .hint-box { background: #3a3410; }
.feedback { border-radius: 18px; padding: 1rem 1.2rem; margin-top: 1rem; animation: pop .3s; } .feedback.ok { background: var(--green-l); } .feedback.bad { background: #fff7ed; } html[data-theme=dark] .feedback.bad { background: #3b2a16; }

.exp { margin: .6rem 0 0; }
.quiz-actions { margin-top: 1.2rem; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } } @keyframes pop { from { transform: scale(.96); opacity: 0; } }
.result-top { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; } .result-top > div { flex: 1; }
.big-score { font-size: 2.4rem; font-weight: 800; margin: 0; color: var(--sky); }
.rev { border-radius: 14px; padding: .6rem 1rem; margin-bottom: .5rem; border: 1px solid var(--line); } .rev summary { cursor: pointer; font-weight: 700; } .rev.ok { background: var(--green-l); } .rev.bad { background: var(--red-l); } .rev p { margin: .3rem 0; }
.badge-dot { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); font-size: .8rem; }
.pill-list { display: flex; flex-wrap: wrap; gap: .8rem; margin-bottom: 1rem; } .pill-row { display: flex; align-items: center; gap: .8rem; background: var(--surface2); border-radius: 16px; padding: .4rem 1rem; }
.advice { display: flex; gap: .8rem; align-items: center; background: #fff7ed; border-radius: 16px; padding: .8rem 1rem; margin: 1rem 0; } .advice.ok { background: var(--green-l); } html[data-theme=dark] .advice { background: #3b2a16; } html[data-theme=dark] .advice.ok { background: var(--green-l); }

/* ===== التقدم والشارات ===== */
.subj-progress { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1rem; }
.sp { display: flex; flex-direction: column; align-items: center; gap: .3rem; background: var(--surface2); border-radius: 16px; padding: 1rem; text-align: center; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .8rem; }
.badge { text-align: center; background: var(--surface2); border-radius: 18px; padding: .9rem .6rem; filter: grayscale(1); opacity: .5; }
.badge.on { filter: none; opacity: 1; background: linear-gradient(135deg, #fef3c7, #fde68a); } html[data-theme=dark] .badge.on { background: linear-gradient(135deg, #5b4a12, #3a3410); }
.badge span { font-size: 2.2rem; display: block; } .badge b { display: block; font-size: .95rem; } .badge small { display: block; line-height: 1.4; }
.chart { max-width: 100%; }
.data-table { width: 100%; border-collapse: collapse; font-size: .93rem; margin: .6rem 0; }
.data-table th { background: var(--surface2); text-align: start; padding: .55rem .7rem; } .data-table td { padding: .55rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.data-table tr.off td { opacity: .55; } .nowrap { white-space: nowrap; } .nowrap .btn { margin-inline-end: .25rem; }
.visual .data-table { max-width: 420px; margin: .6rem auto; }

/* ===== النوافذ والرسائل ===== */

.modal { background: var(--surface); border-radius: 24px; padding: 1.4rem 1.6rem; width: min(520px, 100%); max-height: 90vh; overflow: auto; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: pop .25s; }
.modal.wide { width: min(980px, 100%); } .modal label { margin-bottom: .6rem; }
.modal-x { position: absolute; left: 1rem; top: 1rem; border: 0; background: var(--surface2); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; }
@keyframes fade { from { opacity: 0; } }
#toasts { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: .4rem; align-items: center; pointer-events: none; }
.toast { background: #12304a; color: #fff; padding: .6rem 1.2rem; border-radius: 99px; font-weight: 700; box-shadow: var(--shadow); animation: pop .25s; transition: opacity .4s, transform .4s; }
.toast.ok { background: #047857; } .toast.bad { background: #b91c1c; } .toast.out { opacity: 0; transform: translateY(10px); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall 2.6s ease-in forwards; }
@keyframes fall { to { top: 105vh; transform: rotate(720deg); } }
.flash { perspective: 800px; margin: 1rem 0; } .flash-card { min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(135deg, var(--sky-l), var(--violet-l)); border-radius: 22px; padding: 1.4rem; cursor: pointer; font-size: 1.3rem; font-weight: 700; transition: transform .3s; }
.flash-card .back { font-size: 1.05rem; font-weight: 500; } .flash-card:active { transform: rotateY(12deg); }

/* ===== المشرف ===== */
.admin-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .6rem; }
.tabs { display: flex; gap: .3rem; flex-wrap: wrap; margin: .6rem 0 1rem; border-bottom: 2px solid var(--line); }
.tabs a { text-decoration: none; padding: .55rem 1rem; border-radius: 12px 12px 0 0; font-weight: 700; color: var(--muted); }
.tabs a.on { background: var(--surface); color: #0369a1; border: 2px solid var(--line); border-bottom-color: var(--surface); margin-bottom: -2px; }
.tree { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .4rem .9rem; margin: .5rem 0; }
.tree .tree { margin-inline-start: 1rem; } .tree summary { cursor: pointer; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .3rem 0; }
.acts { margin-inline-start: auto; display: inline-flex; gap: .25rem; flex-wrap: wrap; }
.tree-ch { background: var(--surface2); border-radius: 12px; padding: .5rem .8rem; margin: .5rem 0 .5rem 0; }
.tree-l { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .35rem 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; font-size: .93rem; }
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: .5rem; margin-bottom: .8rem; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem 1rem; } .form-grid .full { grid-column: 1 / -1; } .form-grid h2 { margin-bottom: 0; }
.qform { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1rem; } .preview { position: sticky; top: 0; align-self: start; background: var(--surface2); }
[data-typebox] .row { margin-bottom: .4rem; } [data-typebox] input[type=radio] { flex-shrink: 0; }
.imgs { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; } .thumb { position: relative; } .thumb img { width: 110px; height: 80px; object-fit: cover; border-radius: 10px; } .thumb button { position: absolute; top: 2px; left: 2px; border: 0; border-radius: 50%; background: var(--red); color: #fff; width: 22px; height: 22px; cursor: pointer; font-size: .7rem; }
.chap-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; background: var(--surface2); border-radius: 14px; padding: .8rem; margin-top: .5rem; }
.unit-pick { margin: .4rem 0; } .unit-pick small { display: block; font-weight: 700; } .unit-pick label { display: flex; font-size: .9rem; }
.plan { background: var(--surface2); border-radius: 14px; padding: .8rem 1rem; margin-top: 1rem; max-height: 260px; overflow: auto; } .plan p { margin: .3rem 0; }
.errs { background: var(--red-l); border-radius: 12px; padding: .5rem 1rem; max-height: 220px; overflow: auto; font-size: .88rem; } .errs p { margin: .2rem 0; }

/* ===== الكسور ===== */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.1; margin: 0 .12em; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 .2em; }

/* ===== الجوال والتابلت ===== */
@media (max-width: 900px) {
  .topnav { display: none; }
  .chip { margin-inline-start: auto; }
  #bottomnav:not([hidden]) { display: flex; position: fixed; bottom: 0; inset-inline: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: .3rem .3rem calc(.3rem + env(safe-area-inset-bottom)); justify-content: space-around; box-shadow: 0 -4px 16px rgba(0,0,0,.05); }
  #bottomnav a { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--muted); font-size: .75rem; font-weight: 700; padding: .25rem .5rem; border-radius: 12px; min-width: 60px; }
  #bottomnav a span { font-size: 1.35rem; } #bottomnav a.on { color: #0369a1; background: var(--sky-l); }
  .stats { grid-template-columns: repeat(2, 1fr); } .cards-3 { grid-template-columns: 1fr; } .two-col { grid-template-columns: 1fr; }
  .levels { grid-template-columns: repeat(2, 1fr); } .tools-grid { grid-template-columns: repeat(3, 1fr); }
  .qform, .form-grid { grid-template-columns: 1fr; }

}
@media (max-width: 560px) {
  html { font-size: calc(16px * var(--fs)); }
  main { padding: .8rem .7rem 2rem; } .card { padding: 1rem; }
  .hero { flex-direction: column; text-align: center; } .bubble::before { display: none; }
  .chip b { display: none; } .path { grid-template-columns: 1fr; }
  .subject-head, .lesson-head { flex-wrap: wrap; } .match-row { grid-template-columns: 1fr; } .match-arrow { display: none; }
  .q-text { font-size: 1.12rem; } .intro { flex-direction: column; } .data-table { font-size: .82rem; }
  .tools-grid { grid-template-columns: repeat(2, 1fr); }
}

  <script>/* js/store.js */
/* التخزين المحلي: IndexedDB مع نسخة في الذاكرة، وبديل localStorage إن لم يتوفر */
(function () {
  const DB_NAME = 'saudi-learning-platform';
  const STORE = 'kv';
  let db = null;
  const mem = {};
  let useLS = false;

  function openDB() {
    return new Promise((resolve) => {
      try {
        if (!window.indexedDB) { useLS = true; return resolve(); }
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE);
        req.onsuccess = () => { db = req.result; resolve(); };
        req.onerror = () => { useLS = true; resolve(); };
      } catch (e) { useLS = true; resolve(); }
    });
  }

  async function loadAll() {
    if (useLS) {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('slp:')) { try { mem[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } catch (e) {} }
      }
      return;
    }
    await new Promise((resolve) => {
      const tx = db.transaction(STORE, 'readonly');
      const st = tx.objectStore(STORE);
      const req = st.openCursor();
      req.onsuccess = () => {
        const c = req.result;
        if (c) { mem[c.key] = c.value; c.continue(); } else resolve();
      };
      req.onerror = () => resolve();
    });
  }

  function persist(key, value) {
    if (useLS) {
      try { localStorage.setItem('slp:' + key, JSON.stringify(value)); }
      catch (e) { window.App && App.toast && App.toast('تعذّر الحفظ: مساحة التخزين ممتلئة. صدّر نسخة احتياطية واحذف بعض الصور.', 'bad'); }
      return;
    }
    try {
      const tx = db.transaction(STORE, 'readwrite');
      if (value === undefined) tx.objectStore(STORE).delete(key); else tx.objectStore(STORE).put(value, key);
      tx.onerror = () => App.toast && App.toast('تعذّر الحفظ في قاعدة البيانات المحلية.', 'bad');
    } catch (e) { console.error(e); }
  }

  const Store = {
    async init() { await openDB(); await loadAll(); },
    get(key, def) { return key in mem ? mem[key] : (def === undefined ? undefined : JSON.parse(JSON.stringify(def))); },
    set(key, value) { mem[key] = value; persist(key, value); },
    del(key) { delete mem[key]; persist(key, undefined); },
    keys() { return Object.keys(mem); },
    dump() { return JSON.parse(JSON.stringify(mem)); },
    restore(obj) {
      Object.keys(mem).forEach((k) => this.del(k));
      Object.keys(obj).forEach((k) => this.set(k, obj[k]));
    },
    backend() { return useLS ? 'localStorage' : 'IndexedDB'; }
  };
  window.Store = Store;
})();

</script>
  <script>/* js/ui.js */
/* أدوات الواجهة: تنسيق النصوص والأرقام والكسور، الرسوم التوضيحية، الأصوات، النوافذ */
(function () {
  const App = window.App = window.App || {};
  App.views = App.views || {};
  const EAST = '٠١٢٣٤٥٦٧٨٩';

  App.settings = () => Object.assign({
    digits: 'eastern', sound: true, fontScale: 1, theme: 'light', spacing: false, contrast: false,
    passPct: { 1: 70, 2: 70, 3: 70, 4: 60 }, leaderboard: true, breakMins: 25, adminPin: null,
    termNow: 2, dailyCount: 5
  }, Store.get('settings', {}));
  App.saveSettings = (s) => { Store.set('settings', s); App.applyPrefs(); };

  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  App.esc = esc;

  function digits(s) {
    if (App.settings().digits !== 'eastern') return s;
    return s.replace(/(\d)\.(\d)/g, '$1٫$2').replace(/\d/g, (d) => EAST[d]);
  }
  function fracs(s) {
    return s.replace(/\{(\d+)\/(\d+)\}/g, '<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  /* نص عادي ← HTML آمن مع كسور وأرقام */
  App.t = (s) => {
    const e = esc(s);
    return fracs(e).split(/(<[^>]+>)/).map((p) => (p.startsWith('<') ? p : digits(p))).join('');
  };
  /* HTML موثوق (من ملفات المحتوى) ← معالجة الكسور والأرقام خارج الوسوم */
  App.rich = (html) => fracs(String(html ?? '')).split(/(<[^>]+>)/).map((p) => (p.startsWith('<') ? p : digits(p))).join('');
  App.num = (n) => digits(String(n));
  App.plain = (s) => String(s ?? '').replace(/\{(\d+)\/(\d+)\}/g, '$1/$2');

  /* تحويل إدخال الطالب (أرقام عربية/فاصلة) إلى رقم */
  App.parseNum = (s) => {
    let x = String(s).trim().replace(/[٠-٩]/g, (d) => EAST.indexOf(d)).replace(/[٫,]/g, '.').replace(/\s+/g, '');

/* طبقة المحتوى: تدمج المحتوى الأساسي (من ملفات data) مع تعديلات المشرف المحفوظة محلياً */
(function () {
  const KINDS = ['grades', 'subjects', 'units', 'chapters', 'lessons'];
  const PARENT = { subjects: 'gradeId', units: 'subjectId', chapters: 'unitId', lessons: 'chapterId' };

  function custom() {
    return Store.get('content', { grades: {}, subjects: {}, units: {}, chapters: {}, lessons: {}, bodies: {}, questions: {} });
  }
  function saveCustom(c) { Store.set('content', c); Content._cache = null; }

  function merged(kind) {
    const base = BASE_CURRICULUM[kind] || {};
    const c = custom()[kind] || {};
    const out = {};
    Object.keys(base).forEach((k) => { out[k] = Object.assign({}, base[k]); });
    Object.keys(c).forEach((k) => {
      if (c[k] === null) delete out[k];
      else out[k] = Object.assign({}, out[k] || {}, c[k]);
    });
    return out;
  }

  const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.id).localeCompare(String(b.id));

  const Content = {
    _cache: null,
    all() {
      if (!this._cache) {
        const m = {};
        KINDS.forEach((k) => { m[k] = merged(k); });
        this._cache = m;
      }
      return this._cache;
    },
    get(kind, id) { return this.all()[kind][id]; },
    list(kind, parentId) {
      const items = Object.values(this.all()[kind]);
      const pk = PARENT[kind];
      return (pk ? items.filter((x) => x[pk] === parentId) : items).sort(kind === 'grades' ? (a, b) => a.order - b.order : byOrder);
    },
    grades() { return this.list('grades'); },
    subjects(gid) { return this.list('subjects', gid); },
    units(sid) { return this.list('units', sid); },
    chapters(uid) { return this.list('chapters', uid); },
    lessonsOfChapter(cid) { return this.list('lessons', cid); },
    lessonsOfUnit(uid) { return this.chapters(uid).flatMap((c) => this.lessonsOfChapter(c.id)); },
    lessonsOfSubject(sid) { return this.units(sid).flatMap((u) => this.lessonsOfUnit(u.id)); },
    chaptersOfSubject(sid) { return this.units(sid).flatMap((u) => this.chapters(u.id)); },
    path(lessonId) {
      const lesson = this.get('lessons', lessonId); if (!lesson) return null;
      const chapter = this.get('chapters', lesson.chapterId);
      const unit = chapter && this.get('units', chapter.unitId);
      const subject = unit && this.get('subjects', unit.subjectId);
      const grade = subject && this.get('grades', subject.gradeId);
      return { lesson, chapter, unit, subject, grade };
    },
    terms() {
      const set = new Set(Object.values(this.all().units).map((u) => u.term || 1));
      return [...set].sort();
    },
    termName(t) { return ({ 1: 'الجزء الأول (الفصل الدراسي الأول)', 2: 'الجزء الثاني (الفصل الدراسي الثاني)', 3: 'الجزء الثالث' })[t] || ('الجزء ' + t); },

    /* محتوى الدرس */
    body(lessonId) {
      const c = custom().bodies[lessonId];
      if (c === null) return null;
      const base = (window.BASE_LESSONS || {})[lessonId];
      if (!c && !base) return null;
      const b = Object.assign({}, base || {}, c || {});
      delete b.questions;
      return b;
    },
    hasBody(lessonId) { const b = this.body(lessonId); return !!(b && (b.steps && b.steps.length || b.concepts && b.concepts.length)); },

    /* الأسئلة */
    questions(lessonId) {
      const base = ((window.BASE_LESSONS || {})[lessonId] || {}).questions || [];
      const cq = custom().questions;
      const out = [];
      base.forEach((q) => {
        const gid = lessonId + ':' + q.id;
        if (cq[gid] === null) return;
        out.push(Object.assign({}, q, cq[gid] || {}, { gid, lessonId }));
      });
      Object.keys(cq).forEach((gid) => {
        const q = cq[gid];
        if (q && q.lessonId === lessonId && !base.some((b) => lessonId + ':' + b.id === gid)) out.push(Object.assign({}, q, { gid }));
      });
      return out.sort((a, b) => a.lvl - b.lvl);
    },
    question(gid) { const [lid] = gid.split(':'); return this.questions(lid).find((q) => q.gid === gid); },
    allQuestions(filter) {
      filter = filter || {};
      let lessons = [];
      if (filter.lessonIds) lessons = filter.lessonIds;
      else if (filter.subjectId) lessons = this.lessonsOfSubject(filter.subjectId).map((l) => l.id);
      else if (filter.gradeId) lessons = this.subjects(filter.gradeId).flatMap((s) => this.lessonsOfSubject(s.id)).map((l) => l.id);
      else lessons = Object.keys(this.all().lessons);
      let qs = lessons.flatMap((lid) => this.questions(lid));
      if (filter.levels && filter.levels.length) qs = qs.filter((q) => filter.levels.includes(q.lvl));
      if (filter.types && filter.types.length) qs = qs.filter((q) => filter.types.includes(q.type));
      return qs;
    },

    /* تعديلات المشرف */
    saveNode(kind, obj) {
      const c = custom();
      c[kind][obj.id] = obj; saveCustom(c);
    },
    deleteNode(kind, id) {
      const c = custom();
      // حذف الأبناء أيضاً
      const childKind = { grades: 'subjects', subjects: 'units', units: 'chapters', chapters: 'lessons' }[kind];
      if (childKind) this.list(childKind, id).forEach((ch) => this.deleteNode(childKind, ch.id));
      const c2 = custom();
      if (BASE_CURRICULUM[kind] && BASE_CURRICULUM[kind][id]) c2[kind][id] = null; else delete c2[kind][id];
      saveCustom(c2);
    },
    saveBody(lessonId, body) { const c = custom(); c.bodies[lessonId] = body; saveCustom(c); },
    saveQuestion(q) {
      const c = custom();
      const gid = q.gid || (q.lessonId + ':c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5));
      const copy = Object.assign({}, q); delete copy.gid;
      c.questions[gid] = copy; saveCustom(c);
      return gid;
    },
    deleteQuestion(gid) {
      const c = custom();
      const [lid, qid] = gid.split(':');
      const isBase = (((window.BASE_LESSONS || {})[lid] || {}).questions || []).some((q) => q.id === qid);
      if (isBase) c.questions[gid] = null; else delete c.questions[gid];
      saveCustom(c);
    },
    newId(prefix) { return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  };
  window.Content = Content;
})();

/* الطلاب، التقدم، النقاط والشارات، دفتر الأخطاء، الاختبارات المسجلة */
(function () {
  const App = window.App;
  const DAY = 86400000;
  const BOX_DAYS = [1, 3, 7];

  const BADGES = {
    first_step: { icon: '👣', name: 'الخطوة الأولى', desc: 'أنهيت أول مستوى في درس' },
    lesson_master: { icon: '🏅', name: 'متقن الدرس', desc: 'أتقنت المستويات الأربعة في درس' },
    challenger: { icon: '🧠', name: 'صاحب التحدي', desc: 'اجتزت مستوى التحدي والتميز' },
    streak3: { icon: '🔥', name: 'ثلاثة أيام متتالية', desc: 'تعلمت 3 أيام متتالية' },
    streak7: { icon: '🌟', name: 'أسبوع كامل', desc: 'تعلمت 7 أيام متتالية' },
    points500: { icon: '💎', name: '500 نقطة', desc: 'جمعت 500 نقطة' },
    points1500: { icon: '👑', name: '1500 نقطة', desc: 'جمعت 1500 نقطة' },
    perfect: { icon: '💯', name: 'العلامة الكاملة', desc: 'حصلت على الدرجة الكاملة في اختبار' },
    fixer: { icon: '🛠️', name: 'مصحح الأخطاء', desc: 'صححت 10 أسئلة من دفتر أخطائي' },
    daily: { icon: '☀️', name: 'بطل التحدي اليومي', desc: 'أكملت التحدي اليومي' },
    weekly: { icon: '🏆', name: 'بطل الأسبوع', desc: 'أكملت التحدي الأسبوعي' },
    unit_master: { icon: '🎓', name: 'متقن الوحدة', desc: 'أتقنت كل دروس وحدة أو فصل' },
    explorer: { icon: '🧭', name: 'المستكشف', desc: 'فتحت دروساً في مادتين مختلفتين' }
  };
  const RANKS = ['مستكشف صغير', 'متعلم نشيط', 'باحث مجتهد', 'مفكر لامع', 'متميز', 'عبقري المنصة'];

  const P = {
    BADGES, RANKS,
    profiles() { return Store.get('profiles', []); },
    saveProfiles(list) { Store.set('profiles', list); },
    profile(id) { return this.profiles().find((p) => p.id === id); },
    current() { const id = Store.get('currentProfile'); return id && this.profile(id); },
    setCurrent(id) { Store.set('currentProfile', id); },
    addProfile(p) {
      const list = this.profiles();
      p.id = p.id || 'p' + Date.now().toString(36);
      p.created = Date.now();
      list.push(p); this.saveProfiles(list); return p;
    },
    updateProfile(p) { this.saveProfiles(this.profiles().map((x) => (x.id === p.id ? p : x))); },
    removeProfile(id) { this.saveProfiles(this.profiles().filter((x) => x.id !== id)); Store.del('prog:' + id); },

    get(pid) {
      return Object.assign({ points: 0, badges: {}, streak: { count: 0, last: null, freezes: 0 }, lessons: {}, qstats: {}, mistakes: {}, attempts: [], daily: {}, weekly: {}, fixed: 0, activity: {} }, Store.get('prog:' + pid, {}));
    },
    save(pid, g) { Store.set('prog:' + pid, g); },

    rank(points) { const lvl = Math.floor(Math.sqrt(points / 60)); return { level: lvl + 1, name: RANKS[Math.min(lvl, RANKS.length - 1)], next: Math.pow(lvl + 1, 2) * 60, prev: Math.pow(lvl, 2) * 60 }; },

    touchDay(g) {
      const today = App.today();
      g.activity[today] = (g.activity[today] || 0) + 1;
      const s = g.streak;
      if (s.last === today) return;
      const gap = s.last ? Math.round((new Date(today) - new Date(s.last)) / DAY) : 99;
      if (gap === 1) s.count++;
      else if (gap === 2 && s.freezes > 0) { s.freezes--; s.count++; App.toast('استعملنا «يوم سماح» فحافظت على سلسلتك! 🧊'); }
      else s.count = 1;
      s.last = today;
      if (s.count % 7 === 0 && s.freezes < 2) { s.freezes++; App.toast('ربحت «يوم سماح» جديداً لسلسلتك 🧊'); }
    },
    award(g, id) {
      if (g.badges[id]) return false;
      g.badges[id] = Date.now();
      setTimeout(() => { App.sound('up'); App.toast(`شارة جديدة: ${BADGES[id].icon} ${BADGES[id].name}`, 'ok'); }, 300);
      return true;
    },
    checkBadges(g) {
      if (g.streak.count >= 3) this.award(g, 'streak3');
      if (g.streak.count >= 7) this.award(g, 'streak7');
      if (g.points >= 500) this.award(g, 'points500');
      if (g.points >= 1500) this.award(g, 'points1500');
      if (g.fixed >= 10) this.award(g, 'fixer');
      const subjects = new Set(Object.keys(g.lessons).map((lid) => { const p = Content.path(lid); return p && p.subject.id; }).filter(Boolean));
      if (subjects.size >= 2) this.award(g, 'explorer');
    },

    /* تسجيل إجابة سؤال */
    recordAnswer(pid, q, ok, opts) {
      opts = opts || {};
      const g = this.get(pid);
      const st = g.qstats[q.gid] || { c: 0, w: 0 };
      if (ok) st.c++; else st.w++;
      st.last = Date.now(); g.qstats[q.gid] = st;
      let gained = 0;
      if (ok) { gained = 10 + (q.lvl - 1) * 2 + (opts.firstTry ? 2 : 0) - (opts.hintsUsed || 0) * 2; gained = Math.max(gained, 3); }
      g.points += gained;

      const m = g.mistakes[q.gid];
      if (!ok) g.mistakes[q.gid] = { box: 0, due: Date.now(), added: m ? m.added : Date.now(), wrong: (m ? m.wrong : 0) + 1 };
      else if (m && opts.review) {
        m.box++;
        if (m.box >= BOX_DAYS.length) { delete g.mistakes[q.gid]; g.fixed++; } else m.due = Date.now() + BOX_DAYS[m.box] * DAY;

    dueMistakes(pid) { const g = this.get(pid); return Object.entries(g.mistakes).filter(([, m]) => m.due <= Date.now()).map(([gid]) => gid); },

    /* مستويات الدرس */
    lessonState(pid, lid) { return this.get(pid).lessons[lid] || { levels: {} }; },
    levelUnlocked(pid, lid, lvl) { if (lvl === 1) return true; const s = this.lessonState(pid, lid); return !!(s.levels[lvl - 1] && s.levels[lvl - 1].passed); },
    markViewed(pid, lid) { const g = this.get(pid); g.lessons[lid] = g.lessons[lid] || { levels: {} }; g.lessons[lid].viewed = g.lessons[lid].viewed || Date.now(); this.touchDay(g); this.checkBadges(g); this.save(pid, g); },
    finishLevel(pid, lid, lvl, pct) {
      const g = this.get(pid);
      const s = g.lessons[lid] = g.lessons[lid] || { levels: {} };
      const L = s.levels[lvl] = s.levels[lvl] || { best: 0, passed: false, tries: 0 };
      L.tries++; L.best = Math.max(L.best, pct); L.last = Date.now();
      const need = App.settings().passPct[lvl] ?? 70;
      const justPassed = !L.passed && pct >= need;
      if (pct >= need) L.passed = true;
      if (justPassed) { g.points += 20 * lvl; this.award(g, 'first_step'); if (lvl === 4) this.award(g, 'challenger'); }
      const mastered = [1, 2, 3, 4].every((k) => s.levels[k] && s.levels[k].passed);
      if (mastered && !s.mastered) {
        s.mastered = Date.now(); g.points += 100; this.award(g, 'lesson_master');
        const p = Content.path(lid);
        if (p) {
          const all = Content.lessonsOfChapter(p.chapter.id).filter((l) => Content.questions(l.id).length);
          if (all.length && all.every((l) => (g.lessons[l.id] || {}).mastered)) { this.award(g, 'unit_master'); g.certs = g.certs || {}; g.certs[p.chapter.id] = Date.now(); }
        }
      }
      this.touchDay(g); this.checkBadges(g); this.save(pid, g);
      return { passed: L.passed, justPassed, need, mastered: !!s.mastered };
    },
    lessonPct(pid, lid) {
      const s = this.lessonState(pid, lid);
      const n = [1, 2, 3, 4].filter((k) => s.levels[k] && s.levels[k].passed).length;
      return s.mastered ? 100 : n * 25;
    },
    subjectPct(pid, sid) {
      const ls = Content.lessonsOfSubject(sid).filter((l) => Content.questions(l.id).length);
      if (!ls.length) return 0;
      return ls.reduce((a, l) => a + this.lessonPct(pid, l.id), 0) / ls.length;
    },

    /* محاولات الاختبارات */
    addAttempt(pid, att) {
      const g = this.get(pid);
      att.id = 'a' + Date.now().toString(36); att.date = Date.now();
      g.attempts.push(att);
      g.points += Math.round(att.pct / 5);

      this.touchDay(g); this.checkBadges(g); this.save(pid, g);
      return att;
    },

    /* تحليل نقاط القوة والضعف */
    lessonAccuracy(pid) {
      const g = this.get(pid);
      const by = {};
      Object.entries(g.qstats).forEach(([gid, st]) => {
        const lid = gid.split(':')[0];
        by[lid] = by[lid] || { c: 0, w: 0 };
        by[lid].c += st.c; by[lid].w += st.w;
      });
      return Object.entries(by).map(([lid, s]) => ({ lid, c: s.c, w: s.w, pct: Math.round((100 * s.c) / Math.max(1, s.c + s.w)) })).filter((x) => Content.get('lessons', x.lid));
    },
    totals(pid) {
      const g = this.get(pid);
      let c = 0, w = 0;
      Object.values(g.qstats).forEach((s) => { c += s.c; w += s.w; });
      const tests = g.attempts.length;
      const avg = tests ? Math.round(g.attempts.reduce((a, x) => a + x.pct, 0) / tests) : 0;

    },

    /* التحديات */
    weekKey() { const d = new Date(); const onejan = new Date(d.getFullYear(), 0, 1); return d.getFullYear() + '-w' + Math.ceil(((d - onejan) / DAY + onejan.getDay() + 1) / 7); },
    weekly(pid) {

    bumpWeekly(pid, field) {

      this.save(pid, g);
    }
  };

})();

(function () {
  const App = window.App;
  const t = (s) => App.t(s);
  const PRAISE = ['أحسنت! 🌟', 'رائع! استمر هكذا 👏', 'إجابة ممتازة! 🎉', 'عمل جميل! 💪', 'ممتاز، أنت تتقدم! 🚀'];
  const ENCOURAGE = ['لا بأس، الخطأ طريق التعلم 🌱', 'محاولة جيدة! لنفهم السبب معاً 💡', 'قريب! اقرأ التوضيح وستتقنها 👍', 'كل خطأ يجعلك أقوى 💪'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const TYPE_NAMES = { mcq: 'اختيار من متعدد', tf: 'صواب أو خطأ', fill: 'أكمل الفراغ', num: 'مسألة عددية', match: 'توصيل', order: 'ترتيب' };
  App.TYPE_NAMES = TYPE_NAMES;
  App.LEVEL_NAMES = { 1: 'الأساسيات', 2: 'الفهم', 3: 'التطبيق', 4: 'التحدي والتميز' };

  function correctText(q) {
    switch (q.type) {
      case 'mcq': return q.opts[q.a];
      case 'tf': return q.a ? 'صواب' : 'خطأ';
      case 'fill': return [].concat(q.a)[0];
      case 'num': return String(q.a);
      case 'match': return q.pairs.map((p) => `${p[0]} ← ${p[1]}`).join('، ');
      case 'order': return q.items.join(' ← ');
    }
    return '';
  }
  App.correctText = correctText;

  function renderQ(q, st) {
    const img = q.img ? (q.img.kind ? App.visual(q.img) : `<img class="q-img" src="${App.esc(q.img)}" alt="">`) : '';
    let body = '';
    if (q.type === 'mcq') {
      st.order = st.order || App.shuffle(q.opts.map((_, i) => i));
      body = `<div class="opts">${st.order.map((i, k) => `<button class="opt" data-i="${i}"><span class="opt-k">${['أ', 'ب', 'ج', 'د', 'هـ', 'و'][k]}</span><span>${t(q.opts[i])}</span></button>`).join('')}</div>`;
    } else if (q.type === 'tf') {
      body = `<div class="opts tf"><button class="opt" data-i="true">✔️ صواب</button><button class="opt" data-i="false">✖️ خطأ</button></div>`;
    } else if (q.type === 'fill') {
      body = `<input class="ans-input" type="text" autocomplete="off" placeholder="اكتب إجابتك هنا">`;
    } else if (q.type === 'num') {
      body = `<input class="ans-input num" type="text" inputmode="decimal" autocomplete="off" placeholder="اكتب العدد">`;
    } else if (q.type === 'match') {
      st.rights = st.rights || App.shuffle(q.pairs.map((p) => p[1]));
      body = `<div class="match">${q.pairs.map((p, i) => `<div class="match-row"><span class="match-l">${t(p[0])}</span><span class="match-arrow">←</span><select data-i="${i}"><option value="">اختر...</option>${st.rights.map((r) => `<option value="${App.esc(r)}">${App.esc(App.plain(r))}</option>`).join('')}</select></div>`).join('')}</div>`;
    } else if (q.type === 'order') {
      st.seq = st.seq || (() => { let s; do { s = App.shuffle(q.items.map((_, i) => i)); } while (q.items.length > 1 && s.every((v, i) => v === i)); return s; })();
      body = `<ol class="order">${st.seq.map((i, k) => `<li><span>${t(q.items[i])}</span><span class="ord-btns"><button class="mini" data-up="${k}" aria-label="أعلى">▲</button><button class="mini" data-down="${k}" aria-label="أسفل">▼</button></span></li>`).join('')}</ol>`;
    }
    return `<div class="q-text">${t(q.q)} ${App.speakBtn(q.q)}</div>${img}<div class="q-body" data-type="${q.type}">${body}</div>`;
  }

  function readAnswer(q, root, st) {
    if (q.type === 'mcq') { const s = root.querySelector('.opt.sel'); return s ? Number(s.dataset.i) : null; }
    if (q.type === 'tf') { const s = root.querySelector('.opt.sel'); return s ? s.dataset.i === 'true' : null; }
    if (q.type === 'fill' || q.type === 'num') { const v = root.querySelector('.ans-input').value; return v.trim() === '' ? null : v; }
    if (q.type === 'match') { const vals = [...root.querySelectorAll('select')].map((s) => s.value); return vals.some((v) => !v) ? null : vals; }
    if (q.type === 'order') return st.seq.slice();
    return null;
  }
  function isCorrect(q, ans) {
    if (ans === null || ans === undefined) return false;
    switch (q.type) {
      case 'mcq': return ans === q.a;
      case 'tf': return ans === q.a;
      case 'fill': return [].concat(q.a).some((x) => App.normText(x) === App.normText(ans));
      case 'num': { const v = App.parseNum(ans); return Math.abs(v - Number(q.a)) <= (q.tol || 1e-6); }
      case 'match': return q.pairs.every((p, i) => ans[i] === p[1]);
      case 'order': return ans.every((v, i) => v === i);
    }
    return false;
  }
  function givenText(q, ans) {
    if (ans === null || ans === undefined) return '—';
    if (q.type === 'mcq') return q.opts[ans];
    if (q.type === 'tf') return ans ? 'صواب' : 'خطأ';
    if (q.type === 'match') return q.pairs.map((p, i) => `${p[0]} ← ${ans[i]}`).join('، ');
    if (q.type === 'order') return ans.map((i) => q.items[i]).join(' ← ');
    return String(ans);
  }
  App.isCorrect = isCorrect;

  function bind(q, root, st) {
    root.querySelectorAll('.opt').forEach((b) => b.onclick = () => {
      if (root.classList.contains('locked')) return;
      root.querySelectorAll('.opt').forEach((x) => x.classList.remove('sel'));
      b.classList.add('sel'); App.sound('tap');
    });
    const reorder = () => {
      const ol = root.querySelector('.order');
      ol.innerHTML = st.seq.map((i, k) => `<li><span>${t(q.items[i])}</span><span class="ord-btns"><button class="mini" data-up="${k}" aria-label="أعلى">▲</button><button class="mini" data-down="${k}" aria-label="أسفل">▼</button></span></li>`).join('');
      bindOrder();
    };
    const bindOrder = () => root.querySelectorAll('[data-up],[data-down]').forEach((b) => b.onclick = () => {
      if (root.classList.contains('locked')) return;
      const k = Number(b.dataset.up ?? b.dataset.down), j = b.dataset.up !== undefined ? k - 1 : k + 1;
      if (j < 0 || j >= st.seq.length) return;
      [st.seq[k], st.seq[j]] = [st.seq[j], st.seq[k]]; reorder();
    });
    if (q.type === 'order') bindOrder();
    const inp = root.querySelector('.ans-input');
    if (inp) setTimeout(() => inp.focus(), 50);
  }

  /* ========== تشغيل جلسة أسئلة ==========
     opts: { title, subtitle, questions, mode: 'practice'|'test', timeLimit (دقائق), review (مراجعة أخطاء), onFinish(result), back } */
  App.runQuiz = (opts) => {
    const pid = Progress.current().id;
    const qs = opts.questions;
    const states = qs.map(() => ({ hints: 0, tries: 0 }));
    const answers = [];
    let i = 0;
    const started = Date.now();
    let timer = null;
    const main = document.getElementById('main');
    const practice = opts.mode !== 'test';

    function finish() {
      clearInterval(timer);
      const correct = answers.filter((a) => a && a.ok).length;
      const pct = qs.length ? Math.round((100 * correct) / qs.length) : 0;
      const bySubject = {}, byLesson = {};
      qs.forEach((q, k) => {
        const p = Content.path(q.lessonId); const sid = p ? p.subject.id : '?';
        bySubject[sid] = bySubject[sid] || { c: 0, t: 0 }; bySubject[sid].t++;
        byLesson[q.lessonId] = byLesson[q.lessonId] || { c: 0, t: 0 }; byLesson[q.lessonId].t++;
        if (answers[k] && answers[k].ok) { bySubject[sid].c++; byLesson[q.lessonId].c++; }
      });
      const result = { correct, total: qs.length, pct, bySubject, byLesson, answers: answers.map((a, k) => ({ gid: qs[k].gid, ok: !!(a && a.ok), given: a ? a.given : '—' })), duration: Math.round((Date.now() - started) / 1000) };
      opts.onFinish && opts.onFinish(result);
      showResult(result);
    }

    function showResult(r) {
      const mood = r.pct >= 80 ? 'cheer' : r.pct >= 50 ? 'happy' : 'think';
      if (r.pct >= 80) { App.confetti(); App.sound('up'); }
      const subjRows = Object.entries(r.bySubject).map(([sid, s]) => { const sub = Content.get('subjects', sid); return `<div class="pill-row"><b>${t(sub ? sub.name : sid)}</b><span>${App.num(s.c)} / ${App.num(s.t)}</span>${App.ring(100 * s.c / s.t, 46)}</div>`; }).join('');
      const review = qs.map((q, k) => {
        const a = r.answers[k];
        return `<details class="rev ${a.ok ? 'ok' : 'bad'}"><summary><span class="badge-dot">${a.ok ? '✔' : '✖'}</span> ${t(App.plain(q.q).slice(0, 90))}</summary>
          <p><b>إجابتك:</b> ${t(a.given)}</p>${a.ok ? '' : `<p><b>الإجابة الصحيحة:</b> ${t(correctText(q))}</p>`}<p class="exp">💡 ${t(q.exp || '')}</p></details>`;
      }).join('');
      main.innerHTML = `<section class="card result">
        <div class="result-top">${App.mascot(mood, 110)}<div><h2>${t(opts.title)}</h2><p class="big-score">${App.num(r.correct)} / ${App.num(r.total)}</p><p>${r.pct >= 80 ? 'نتيجة رائعة! أنت متمكن 🌟' : r.pct >= 50 ? 'جيد! راجع الأسئلة التي أخطأت فيها لتصبح أقوى.' : 'لا تقلق، راجع الشرح ثم حاول مرة أخرى. أنت قادر! 💪'}</p></div>${App.ring(r.pct, 96)}</div>
        ${Object.keys(r.bySubject).length > 1 ? `<h3>النتيجة حسب المادة</h3><div class="pill-list">${subjRows}</div>` : ''}
        ${opts.resultExtra ? opts.resultExtra(r) : ''}
        <h3>مراجعة الإجابات</h3><div class="reviews">${review}</div>
        <div class="row end"><button class="btn ghost" data-act="again">🔁 إعادة المحاولة</button><button class="btn primary" data-act="back">متابعة</button></div></section>`;
      main.querySelector('[data-act=again]').onclick = () => App.runQuiz(Object.assign({}, opts, { questions: opts.reshuffle ? opts.reshuffle() : qs }));
      main.querySelector('[data-act=back]').onclick = () => (opts.back ? opts.back(r) : App.go('home'));
      window.scrollTo(0, 0);
    }

    function show() {
      if (i >= qs.length) return finish();
      const q = qs[i], st = states[i];
      const remaining = opts.timeLimit ? Math.max(0, opts.timeLimit * 60 - Math.round((Date.now() - started) / 1000)) : null;
      main.innerHTML = `<section class="card quiz">
        <div class="quiz-head"><button class="btn ghost sm" data-act="quit">✕ خروج</button><div class="q-title"><b>${t(opts.title)}</b>${opts.subtitle ? `<small>${t(opts.subtitle)}</small>` : ''}</div>${remaining !== null ? `<div class="timer" id="timer">⏱ ${fmtT(remaining)}</div>` : `<div class="q-count">${App.num(i + 1)} / ${App.num(qs.length)}</div>`}</div>
        <div class="bar"><i style="width:${(100 * i) / qs.length}%"></i></div>
        <div class="q-meta"><span class="tag lvl${q.lvl}">${App.LEVEL_NAMES[q.lvl] || ''}</span><span class="tag">${TYPE_NAMES[q.type]}</span>${q.tags && q.tags.includes('critical') ? '<span class="tag">تفكير ناقد</span>' : ''}</div>
        <div class="q-wrap">${renderQ(q, st)}</div>
        <div class="hint-box" hidden></div>
        <div class="feedback" hidden></div>
        <div class="row between quiz-actions">${practice && (q.hints || q.exp) ? '<button class="btn ghost" data-act="hint">💡 تلميح</button>' : '<span></span>'}<button class="btn primary big" data-act="check">${practice ? 'تحقق' : (i === qs.length - 1 ? 'إنهاء الاختبار' : 'التالي')}</button></div>
      </section>`;
      const root = main.querySelector('.q-wrap');
      bind(q, root, st);
      main.querySelector('[data-act=quit]').onclick = () => App.confirm('هل تريد الخروج؟ لن تُحفظ هذه المحاولة.', () => { clearInterval(timer); opts.back ? opts.back(null) : App.go('home'); });
      const hb = main.querySelector('[data-act=hint]');
      if (hb) hb.onclick = () => {
        const hints = (q.hints || []).slice();
        hints.push('خطوات الحل: ' + (q.exp || ''));
        if (st.hints >= hints.length) return;
        st.hints++;
        const box = main.querySelector('.hint-box'); box.hidden = false;
        box.innerHTML = hints.slice(0, st.hints).map((h, k) => `<p>${k === hints.length - 1 && st.hints === hints.length ? '🧩' : '💡'} ${t(h)}</p>`).join('');
        if (st.hints >= hints.length) hb.disabled = true;
      };
      const cb = main.querySelector('[data-act=check]');
      const inp = root.querySelector('.ans-input');
      if (inp) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') cb.click(); });
      cb.onclick = () => {
        if (cb.dataset.next) { i++; show(); return; }
        const ans = readAnswer(q, root, st);
        if (ans === null) { App.toast('اختر أو اكتب إجابتك أولاً 🙂'); return; }
        const ok = isCorrect(q, ans);
        st.tries++;
        Progress.recordAnswer(pid, q, ok, { firstTry: st.tries === 1, hintsUsed: st.hints, review: opts.review });
        answers[i] = answers[i] || { ok, given: givenText(q, ans) };
        if (!practice) { i++; show(); return; }
        root.classList.add('locked');
        root.querySelectorAll('.opt').forEach((b) => {
          const v = q.type === 'tf' ? b.dataset.i === 'true' : Number(b.dataset.i);
          if (v === q.a) b.classList.add('right'); else if (b.classList.contains('sel')) b.classList.add('wrong');
        });
        root.querySelectorAll('select, input').forEach((x) => x.disabled = true);
        App.sound(ok ? 'ok' : 'bad');
        const fb = main.querySelector('.feedback'); fb.hidden = false;
        fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
        fb.innerHTML = `<div class="fb-head">${App.mascot(ok ? 'cheer' : 'think', 64)}<div><b>${ok ? pick(PRAISE) : pick(ENCOURAGE)}</b>${ok ? '' : `<p>الإجابة الصحيحة: <b>${t(correctText(q))}</b></p>`}</div></div><p class="exp">💡 ${t(q.exp || '')}</p>${ok ? '' : '<p class="muted">أضفنا هذا السؤال إلى «دفتر أخطائي» لتراجعه لاحقاً.</p>'}`;
        cb.textContent = i === qs.length - 1 ? 'عرض النتيجة' : 'السؤال التالي ←';
        cb.dataset.next = '1';
        if (hb) hb.disabled = true;
      };
    }
    const fmtT = (s) => App.num(Math.floor(s / 60)) + ':' + App.num(String(s % 60).padStart(2, '0'));
    if (opts.timeLimit) {
      timer = setInterval(() => {
        const rem = opts.timeLimit * 60 - Math.round((Date.now() - started) / 1000);
        const el = document.getElementById('timer');
        if (el) el.textContent = '⏱ ' + fmtT(Math.max(0, rem));
        if (rem <= 0) { clearInterval(timer); App.toast('انتهى الوقت! ⏰'); for (; i < qs.length; i++) answers[i] = answers[i] || { ok: false, given: '—' }; finish(); }
      }, 1000);
    }
    show();
  };

  /* بناء اختبار تلقائي متوازن من بنك الأسئلة */
  App.buildTest = (spec) => {
    // spec: { lessonIds, count, levels, types, perSubject: {sid: n}, balanceLevels }
    let pool = Content.allQuestions({ lessonIds: spec.lessonIds, levels: spec.levels, types: spec.types });
    if (!pool.length) return [];
    const take = (arr, n) => {
      // توزيع متوازن على المستويات والدروس
      const groups = {};
      App.shuffle(arr).forEach((q) => { const k = q.lvl; (groups[k] = groups[k] || []).push(q); });
      const out = []; const keys = Object.keys(groups).sort();
      while (out.length < n && keys.some((k) => groups[k].length)) keys.forEach((k) => { if (out.length < n && groups[k].length) out.push(groups[k].shift()); });
      return out;
    };
    let qs = [];
    if (spec.perSubject) {
      Object.entries(spec.perSubject).forEach(([sid, n]) => {
        const sub = pool.filter((q) => { const p = Content.path(q.lessonId); return p && p.subject.id === sid; });
        qs = qs.concat(take(sub, n));
      });
    } else qs = take(pool, spec.count || 10);
    return qs.sort((a, b) => a.lvl - b.lvl);
  };
})();

</script>

      </section>
      ${lastL ? (() => { const pth = Content.path(lastL[0]); return `<a class="continue" href="#/lesson/${lastL[0]}">▶ تابع من حيث توقفت: <b>${t(pth.lesson.title)}</b> <small>${t(pth.subject.name)}</small></a>`; })() : ''}
      <h2 class="sec-title">موادي — ${t(grade ? grade.name : '')}</h2>
      <section class="subjects">${subjects.map((s) => { const st = App.subjStyle(s); const pct = Progress.subjectPct(p.id, s.id); const nl = Content.lessonsOfSubject(s.id).length; const ready = Content.lessonsOfSubject(s.id).filter((l) => Content.hasBody(l.id)).length; return `<a class="subject-card ${st.cls}" href="#/subject/${s.id}"><span class="s-icon">${st.icon}</span><div><b>${t(s.name)}</b><small>${N(nl)} درساً، ${N(ready)} جاهز للشرح</small></div>${App.ring(pct, 60, '#fff')}</a>`; }).join('') || '<p class="muted">لا توجد مواد لهذا الصف بعد.</p>'}</section>
      <section class="cards-3">
        <div class="mini-card ${daily ? 'done' : ''}"><h3>☀️ التحدي اليومي</h3><p>${daily ? 'أنجزت تحدي اليوم! عد غداً لتحدٍّ جديد.' : `${N(App.settings().dailyCount)} أسئلة متنوعة من دروسك. اربح ${N(50)} نقطة إضافية!`}</p>${daily ? '' : '<button class="btn primary" data-act="daily">ابدأ التحدي</button>'}</div>
        <div class="mini-card"><h3>🏆 تحدي الأسبوع</h3><p>اجتز ${N(6)} مستويات (${N(Math.min(wk.levels, 6))}/${N(6)}) وأكمل اختبارين (${N(Math.min(wk.tests, 2))}/${N(2)}).</p><div class="bar"><i style="width:${(100 * (Math.min(wk.levels, 6) + Math.min(wk.tests, 2) * 3)) / 12}%"></i></div>${wk.claimed ? '<p class="ok-text">✔ أنجزته هذا الأسبوع!</p>' : ''}</div>
        <div class="mini-card"><h3>📝 دفتر أخطائي</h3><p>${due ? `${N(due)} سؤال جاهز للمراجعة الآن.` : 'لا توجد أسئلة مستحقة للمراجعة الآن. 👏'}</p>${due ? '<a class="btn primary" href="#/mistakes">راجع الآن</a>' : '<a class="btn ghost" href="#/mistakes">افتح الدفتر</a>'}</div>
      </section>
      ${pendingAssigned.length ? `<section class="card"><h2>📋 اختبارات من المشرف</h2>${pendingAssigned.map((x) => `<div class="list-row"><div><b>${t(x.title)}</b><small>${t(App.testDesc(x))}</small></div><a class="btn primary" href="#/test/${x.id}">ابدأ</a></div>`).join('')}</section>` : ''}`;
    const d = main().querySelector('[data-act=daily]');
    if (d) d.onclick = () => App.startDaily();
  };

  App.startDaily = () => {
    const p = me();
    const lessons = Content.subjects(p.grade).flatMap((s) => Content.lessonsOfSubject(s.id)).map((l) => l.id);
    const g = Progress.get(p.id);
    const opened = lessons.filter((lid) => g.lessons[lid]);
    let qs = App.buildTest({ lessonIds: opened.length ? opened : lessons, count: App.settings().dailyCount });
    if (!qs.length) return App.toast('لا توجد أسئلة متاحة بعد لصفك.', 'bad');
    App.runQuiz({ title: 'التحدي اليومي ☀️', questions: qs, mode: 'practice', onFinish: (r) => {
      const g2 = Progress.get(p.id); g2.daily = { date: App.today(), done: true, pct: r.pct }; g2.points += 50; Progress.award(g2, 'daily'); Progress.save(p.id, g2);
    }, back: () => App.go('home') });
  };

  /* ===================== المادة ===================== */
  App.views.subject = (sid) => {
    const p = me(); const s = Content.get('subjects', sid);
    if (!s) return App.go('home');
    const st = App.subjStyle(s);
    const units = Content.units(sid);
    const g = Progress.get(p.id);
    const lessonNode = (l) => {
      const has = Content.hasBody(l.id); const nq = Content.questions(l.id).length;
      const pct = Progress.lessonPct(p.id, l.id);
      const ls = g.lessons[l.id] || { levels: {} };
      const stars = [1, 2, 3, 4].map((k) => `<i class="${ls.levels[k] && ls.levels[k].passed ? 'on' : ''}">★</i>`).join('');
      return `<a class="lesson-node ${has ? '' : 'soon'} ${pct === 100 ? 'mastered' : ''}" href="#/lesson/${l.id}">
        <span class="ln-num">${N(l.num)}</span><span class="ln-body"><b>${t(l.title)}</b><small>${l.plan ? 'خطة حل المسألة — ' : ''}ص ${N(l.page)}${has ? '' : '، الشرح قيد الإعداد'}</small></span>
        ${nq ? `<span class="stars">${stars}</span>` : '<span class="tag soon-tag">قريباً</span>'}</a>`;
    };
    main().innerHTML = `<nav class="crumbs"><a href="#/home">الرئيسية</a> › <span>${t(s.name)}</span></nav>
      <section class="subject-head ${st.cls}"><span class="s-icon">${st.icon}</span><div><h1>${t(s.name)}</h1><p>${t(s.book || '')}</p></div>${App.ring(Progress.subjectPct(p.id, sid), 72, '#fff')}</section>
      <div class="row wrap gap"><button class="btn ghost" data-act="subject-test">🧪 اختبار شامل للمادة</button><button class="btn ghost" data-act="placement">🧭 اختبار تحديد المستوى</button><a class="btn ghost" href="#/flash/${sid}">🃏 بطاقات المراجعة</a></div>
      ${units.map((u) => { const chs = Content.chapters(u.id); const uq = Content.lessonsOfUnit(u.id).reduce((a, l) => a + Content.questions(l.id).length, 0);
        return `<section class="unit"><div class="unit-head"><h2>${t(u.title)}</h2>${uq ? `<button class="btn sm" data-unit="${u.id}">اختبار ${s.kind === 'math' ? 'الفصل' : 'الوحدة'}</button>` : ''}</div>
        ${chs.map((c) => (chs.length > 1 || c.title.replace(/^الفصل \d+: /, '') !== u.title.replace(/^(الفصل|الوحدة) \d+: /, '') ? `<h3 class="chapter-title">${t(c.title)} ${(() => { const cq = Content.lessonsOfChapter(c.id).reduce((a, l) => a + Content.questions(l.id).length, 0); return cq ? `<button class="btn xs ghost" data-chapter="${c.id}">اختبار الفصل</button>` : ''; })()} ${g.certs && g.certs[c.id] ? `<button class="btn xs" data-cert="${c.id}">🎓 شهادتي</button>` : ''}</h3>` : (g.certs && g.certs[c.id] ? `<button class="btn xs" data-cert="${c.id}">🎓 شهادتي</button>` : '')) + `<div class="path">${Content.lessonsOfChapter(c.id).map(lessonNode).join('')}</div>`).join('')}</section>`; }).join('')}`;
    const runScope = (title, lessonIds) => {
      const qs = App.buildTest({ lessonIds, count: 15 });
      if (!qs.length) return App.toast('لا توجد أسئلة في هذا الجزء بعد.', 'bad');
      App.runQuiz({ title, questions: qs, mode: 'test', reshuffle: () => App.buildTest({ lessonIds, count: 15 }), onFinish: (r) => { Progress.addAttempt(p.id, Object.assign({ kind: 'auto', title, subjectIds: [sid] }, r)); Progress.bumpWeekly(p.id, 'tests'); }, back: () => App.go('subject', sid) });
    };
    main().querySelectorAll('[data-unit]').forEach((b) => b.onclick = () => { const u = Content.get('units', b.dataset.unit); runScope(`اختبار ${u.title}`, Content.lessonsOfUnit(u.id).map((l) => l.id)); });
    main().querySelectorAll('[data-chapter]').forEach((b) => b.onclick = () => { const c = Content.get('chapters', b.dataset.chapter); runScope(`اختبار ${c.title}`, Content.lessonsOfChapter(c.id).map((l) => l.id)); });
    main().querySelectorAll('[data-cert]').forEach((b) => b.onclick = () => App.printCert(Content.get('chapters', b.dataset.cert)));
    main().querySelector('[data-act=subject-test]').onclick = () => runScope(`الاختبار الشامل — ${s.name}`, Content.lessonsOfSubject(sid).map((l) => l.id));
    main().querySelector('[data-act=placement]').onclick = () => {
      const ids = Content.lessonsOfSubject(sid).map((l) => l.id);
      const qs = App.buildTest({ lessonIds: ids, count: 12, levels: [1, 2, 3] });
      if (!qs.length) return App.toast('لا توجد أسئلة بعد.', 'bad');
      App.runQuiz({ title: 'اختبار تحديد المستوى', subtitle: s.name, questions: qs, mode: 'test',
        onFinish: (r) => Progress.addAttempt(p.id, Object.assign({ kind: 'placement', title: 'تحديد المستوى — ' + s.name, subjectIds: [sid] }, r)),
        resultExtra: (r) => { const weak = Object.entries(r.byLesson).filter(([, v]) => v.c / v.t < 0.7).map(([lid]) => Content.get('lessons', lid)).filter(Boolean);
          return `<div class="advice">${App.mascot('think', 60)}<div><b>توصية نجيب:</b> ${weak.length ? `ابدأ بهذه الدروس: ${weak.map((l) => `<a href="#/lesson/${l.id}">${t(l.title)}</a>`).join('، ')}` : 'مستواك ممتاز في الدروس المتاحة! جرّب مستوى «التحدي والتميز».'}</div></div>`; },
        back: () => App.go('subject', sid) });
    };
  };

  /* ===================== الدرس ===================== */
  App.views.lesson = (lid) => {
    const p = me(); const path = Content.path(lid);
    if (!path) return App.go('home');
    const { lesson: l, subject: s, chapter: c } = path;
    const b = Content.body(lid);
    const qs = Content.questions(lid);
    const st = App.subjStyle(s);
    Progress.markViewed(p.id, lid);
    const crumbs = `<nav class="crumbs"><a href="#/home">الرئيسية</a> › <a href="#/subject/${s.id}">${t(s.name)}</a> › <span>${t(c.title)}</span></nav>`;
    if (!b || !Content.hasBody(lid)) {
      main().innerHTML = `${crumbs}<section class="card center">${App.mascot('think', 110)}<h1>${t(l.title)}</h1><p>صفحة ${N(l.page)} في ${t(s.book || 'كتاب الطالب')}</p>
        <p class="muted">شرح هذا الدرس قيد الإعداد من الكتاب المدرسي، وسيُضاف قريباً. يمكن للمشرف إضافة الشرح والأسئلة من لوحة التحكم.</p>
        ${qs.length ? `<button class="btn primary" data-lvl="1">ابدأ التدريب (${N(qs.length)} سؤالاً)</button>` : ''}</section>`;
      main().querySelectorAll('[data-lvl]').forEach((x) => x.onclick = () => App.go('level', lid, 1));
      return;
    }
    const sec = (n, id, title, html, extra) => `<section class="card lesson-sec" id="${id}"><h2><span class="sec-n">${N(n)}</span>${title}${extra || ''}</h2>${html}</section>`;
    const ls = Progress.lessonState(p.id, lid);
    const levels = [1, 2, 3, 4].map((k) => {
      const n = qs.filter((q) => q.lvl === k).length; const L = ls.levels[k];
      const open = Progress.levelUnlocked(p.id, lid, k);
      return `<button class="level-card lvl${k} ${open ? '' : 'locked'} ${L && L.passed ? 'passed' : ''}" data-lvl="${k}" ${open && n ? '' : 'disabled'}>
        <span class="lv-n">${open ? (L && L.passed ? '✔' : N(k)) : '🔒'}</span><b>${App.LEVEL_NAMES[k]}</b><small>${N(n)} أسئلة${L ? `، أفضل نتيجة ${N(L.best)}٪` : ''}</small>
        <small class="need">${open ? '' : `يُفتح بعد اجتياز «${App.LEVEL_NAMES[k - 1]}» بنسبة ${N(App.settings().passPct[k - 1])}٪`}</small></button>`;
    }).join('');
    const toc = [['goals', 'ماذا سأتعلم؟'], ['intro', 'مقدمة'], ['concepts', 'المفاهيم'], ['steps', 'الشرح'], ['examples', 'أمثلة'], ['visual', 'صورة توضيحية'], ['keys', 'احفظ هذا'], ['mistakes', 'أخطاء شائعة'], ['summary', 'الملخص'], ['quick', 'اختبار قصير'], ['levels', 'التدريبات']];
    main().innerHTML = `${crumbs}
      <section class="lesson-head ${st.cls}"><div><small>${t(c.title)}، الدرس ${N(l.num)}</small><h1>${t(l.title)}</h1><p class="src">📗 ${t(b.source || '')} ${b.status === 'verified' ? '<span class="tag ok">مراجَع من الكتاب</span>' : '<span class="tag warn">مسودة</span>'}</p></div>${App.ring(Progress.lessonPct(p.id, lid), 70, '#fff')}</section>
      <nav class="toc">${toc.map(([id, n]) => `<a href="#" data-jump="${id}">${n}</a>`).join('')}</nav>
      ${sec(2, 'goals', 'ماذا سأتعلم؟', `<ul class="goals">${(b.objectives || []).map((o) => `<li>🎯 ${t(o)}</li>`).join('')}</ul>`)}
      ${sec(3, 'intro', 'مقدمة', `<div class="intro">${App.mascot('happy', 70)}<p>${t(b.intro || '')}</p></div>`, App.speakBtn(b.intro || ''))}
      ${sec(4, 'concepts', 'المفاهيم الأساسية', `<div class="concepts">${(b.concepts || []).map((x) => `<div class="concept"><b>${t(x.term)}</b><p>${t(x.def)}</p></div>`).join('')}</div>`)}
      ${sec(5, 'steps', 'الشرح خطوة بخطوة', `${(b.steps || []).map((x, k) => `<div class="step"><span class="step-n">${N(k + 1)}</span><div><h3>${t(x.title)} ${App.speakBtn(x.title + '. ' + x.html)}</h3><p>${App.rich(x.html)}</p></div></div>`).join('')}
        ${b.alt ? `<button class="btn ghost" data-act="alt">🤔 لم أفهم، اشرح لي بطريقة أخرى</button><div class="alt" hidden>${App.mascot('think', 60)}<p>${t(b.alt)}</p></div>` : ''}`)}
      ${sec(6, 'examples', 'أمثلة من الحياة اليومية', `${(b.examples || []).map((x) => `<details class="example"><summary>📌 ${t(x.q)}</summary><p>✅ ${t(x.a)}</p></details>`).join('')}${b.life && b.life.length ? `<div class="life">${b.life.map((x) => `<span>🌍 ${t(x)}</span>`).join('')}</div>` : ''}`)}
      ${sec(7, 'visual', 'صور ورسوم توضيحية', `${App.visual(b.visual)}${(b.images || []).map((src) => `<img class="lesson-img" src="${App.esc(src)}" alt="">`).join('')}${b.tool ? `<div class="tool-embed" data-tool="${b.tool}"></div>` : ''}`)}
      ${sec(8, 'keys', 'أهم ما يجب أن أحفظه', `<ul class="keys">${(b.keyPoints || []).map((x) => `<li>⭐ ${t(x)}</li>`).join('')}</ul>`)}
      ${sec(9, 'mistakes', 'أخطاء شائعة… انتبه!', `${(b.mistakes || []).map((x) => `<div class="mistake"><p class="w">❌ ${t(x.wrong)}</p><p class="r">✅ ${t(x.right)}</p></div>`).join('')}`)}
      ${sec(10, 'summary', 'ملخص الدرس', `<p class="summary">${t(b.summary || '')}</p>`, App.speakBtn(b.summary || ''))}
      ${sec(11, 'quick', 'اختبار قصير للتأكد من الفهم', `<p>ثلاثة أسئلة سريعة قبل التدريبات.</p><button class="btn primary" data-act="quick" ${qs.length ? '' : 'disabled'}>ابدأ الاختبار القصير</button>`)}
      <section class="card" id="levels"><h2>🪜 التدريبات المتدرجة</h2><p class="muted">اجتز كل مستوى لتفتح المستوى الذي بعده.</p><div class="levels">${levels}</div>
        <div class="row wrap gap"><button class="btn ghost" data-act="lesson-test" ${qs.length ? '' : 'disabled'}>🧪 اختبار الدرس</button><button class="btn ghost" data-act="flash">🃏 بطاقات المصطلحات</button><button class="btn ghost" data-act="print">🖨️ ورقة عمل للطباعة</button></div></section>`;
    main().querySelectorAll('[data-jump]').forEach((a) => a.onclick = (e) => { e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    const alt = main().querySelector('[data-act=alt]');
    if (alt) alt.onclick = () => { const d = main().querySelector('.alt'); d.hidden = !d.hidden; };
    main().querySelectorAll('[data-lvl]').forEach((x) => x.onclick = () => App.go('level', lid, Number(x.dataset.lvl)));
    main().querySelector('[data-act=quick]').onclick = () => {
      const pool = qs.filter((q) => q.lvl <= 2);
      App.runQuiz({ title: 'اختبار قصير', subtitle: l.title, questions: App.shuffle(pool).slice(0, 3), mode: 'practice', back: () => { App.go('lesson', lid); setTimeout(() => document.getElementById('levels').scrollIntoView(), 50); } });
    };
    main().querySelector('[data-act=lesson-test]').onclick = () => {
      const make = () => App.buildTest({ lessonIds: [lid], count: 10 });
      App.runQuiz({ title: 'اختبار الدرس', subtitle: l.title, questions: make(), reshuffle: make, mode: 'test', onFinish: (r) => { Progress.addAttempt(p.id, Object.assign({ kind: 'lesson', title: 'اختبار درس: ' + l.title, subjectIds: [s.id] }, r)); Progress.bumpWeekly(p.id, 'tests'); }, back: () => App.go('lesson', lid) });
    };
    main().querySelector('[data-act=flash]').onclick = () => App.flashcards((b.concepts || []).map((x) => ({ front: x.term, back: x.def })), l.title);
    main().querySelector('[data-act=print]').onclick = () => App.printWorksheet([lid]);
    main().querySelectorAll('.tool-embed').forEach((el) => App.mountTool(el, el.dataset.tool));
  };

  App.views.level = (lid, lvl) => {
    lvl = Number(lvl);
    const p = me(); const l = Content.get('lessons', lid);
    if (!Progress.levelUnlocked(p.id, lid, lvl)) { App.toast('هذا المستوى مقفل بعد.', 'bad'); return App.go('lesson', lid); }
    const qs = App.shuffle(Content.questions(lid).filter((q) => q.lvl === lvl));
    if (!qs.length) return App.go('lesson', lid);
    App.runQuiz({ title: `المستوى ${App.LEVEL_NAMES[lvl]}`, subtitle: l.title, questions: qs, mode: 'practice',
      reshuffle: () => App.shuffle(Content.questions(lid).filter((q) => q.lvl === lvl)),
      onFinish: (r) => {
        const res = Progress.finishLevel(p.id, lid, lvl, r.pct);
        if (res.justPassed) Progress.bumpWeekly(p.id, 'levels');
        r._res = res;
      },
      resultExtra: (r) => {
        const res = r._res || {};
        if (res.mastered && lvl === 4) return `<div class="advice ok">${App.mascot('cheer', 60)}<div><b>مبروك! أتقنت الدرس كاملاً 🏅</b></div></div>`;
        return res.passed ? `<div class="advice ok">${App.mascot('cheer', 60)}<div><b>اجتزت المستوى!</b> ${lvl < 4 ? `فُتح مستوى «${App.LEVEL_NAMES[lvl + 1]}».` : ''}</div></div>`
          : `<div class="advice">${App.mascot('think', 60)}<div>تحتاج ${N(res.need)}٪ لاجتياز هذا المستوى. راجع الشرح ثم حاول مرة أخرى.</div></div>`;
      },
      back: () => App.go('lesson', lid) });
  };

  /* ===================== البطاقات ===================== */
  App.flashcards = (cards, title) => {
    if (!cards.length) return App.toast('لا توجد بطاقات لهذا الجزء بعد.');
    let k = 0, flipped = false;
    const m = App.modal(`<h3>🃏 ${t(title)}</h3><div class="flash"><div class="flash-card"></div></div><div class="row between"><button class="btn ghost" data-prev>→ السابقة</button><span class="flash-n"></span><button class="btn ghost" data-next>التالية ←</button></div>`);
    const draw = () => { const c = cards[k]; m.el.querySelector('.flash-card').innerHTML = `<div class="${flipped ? 'back' : 'front'}">${t(flipped ? c.back : c.front)}</div><small>${flipped ? '' : 'اضغط لقلب البطاقة'}</small>`; m.el.querySelector('.flash-n').innerHTML = `${N(k + 1)} / ${N(cards.length)}`; };
    m.el.querySelector('.flash-card').onclick = () => { flipped = !flipped; draw(); };
    m.el.querySelector('[data-next]').onclick = () => { k = (k + 1) % cards.length; flipped = false; draw(); };
    m.el.querySelector('[data-prev]').onclick = () => { k = (k - 1 + cards.length) % cards.length; flipped = false; draw(); };
    draw();
  };
  App.views.flash = (sid) => {
    const cards = Content.lessonsOfSubject(sid).flatMap((l) => ((Content.body(l.id) || {}).concepts || []).map((x) => ({ front: x.term, back: x.def })));
    App.go('subject', sid);
    setTimeout(() => App.flashcards(cards, 'بطاقات ' + Content.get('subjects', sid).name), 30);
  };

  /* ===================== الاختبارات ===================== */
  App.myTests = (p) => Store.get('tests', []).filter((x) => x.active !== false && x.gradeId === p.grade && (!x.students || !x.students.length || x.students.includes(p.id)) && App.questionsForTest(x).length);
  App.testDesc = (x) => {
    const subs = (x.subjectIds || []).map((sid) => (Content.get('subjects', sid) || {}).name).filter(Boolean).join(' + ');
    return `${subs}، ${App.questionsForTest(x).length} سؤالاً${x.timeLimit ? `، ${x.timeLimit} دقيقة` : ''}`;
  };
  App.views.tests = () => {
    const p = me(); const g = Progress.get(p.id);
    const assigned = App.myTests(p);
    const subjects = Content.subjects(p.grade);

  App.mountTool = (el, kind) => {
    if (kind === 'numberline') {
      el.innerHTML = `<div class="row wrap gap"><label>المقسوم<input type="number" min="1" max="30" value="15" data-a></label><label>المقسوم عليه<input type="number" min="1" max="10" value="3" data-b></label><button class="btn primary" data-go>اقفز!</button></div><div data-out></div>`;
      const go = () => {
        const a = Math.min(30, Math.max(1, +el.querySelector('[data-a]').value || 1)); const b = Math.min(10, Math.max(1, +el.querySelector('[data-b]').value || 1));
        const out = el.querySelector('[data-out]');
        if (a % b) { out.innerHTML = App.visual({ kind: 'numberline', max: a, step: b }) + `<p>${t(`${a} لا يقبل القسمة على ${b} بدون باقٍ: بعد ${Math.floor(a / b)} قفزات يبقى ${a % b}.`)}</p>`; return; }

        const v = n / d; const r = v < 0.25 ? '0' : v <= 0.75 ? '{1/2}' : '1';
        const cells = Array.from({ length: d }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
        el.querySelector('[data-out]').innerHTML = `<div class="fbar">${cells}</div><div class="fbar half"><i class="on"></i><i></i></div><p class="big-eq">${t(`{${n}/${d}}`)} ≈ ${t(r)}</p><p class="muted">${t(v < 0.25 ? 'البسط أصغر كثيراً من المقام ← نقرّب إلى أدنى (0).' : v <= 0.75 ? `البسط قريب من نصف المقام (${d / 2}) ← نقرّب إلى {1/2}.` : 'البسط قريب جداً من المقام ← نقرّب إلى أعلى (1).')}</p>`;

        const freq = {}; xs.forEach((x) => freq[x] = (freq[x] || 0) + 1); const mx = Math.max(...Object.values(freq));
